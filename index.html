<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>100 Sual | Cosmic Decision Wheel</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cosmic-bg: #070311;
            --purple-glow: rgba(138, 43, 226, 0.5);
            --lavender: #d8b4fe;
            --dark-glass: rgba(20, 10, 40, 0.65);
            --z-bg: 0;
            --z-particles: 10;
            --z-wheel: 20;
            --z-ui: 30;
        }

        body {
            background-color: var(--cosmic-bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .cinzel { font-family: 'Cinzel', serif; }

        #particle-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: var(--z-bg); background: radial-gradient(circle at center, #0f051c 0%, #05010a 100%); pointer-events: none; }
        #particle-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: var(--z-particles); pointer-events: none; }
        #burst-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 25; }

        .glass-panel { background: var(--dark-glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(168, 85, 247, 0.3); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), 0 0 20px rgba(138, 43, 226, 0.15); }
        .text-glow { text-shadow: 0 0 15px rgba(216, 180, 254, 0.7); }

        .wheel-wrapper { position: relative; width: 100%; max-width: 550px; aspect-ratio: 1 / 1; margin: 0 auto; z-index: var(--z-wheel); display: flex; align-items: center; justify-content: center; }
        .wheel-container { position: relative; width: 90%; height: 90%; border-radius: 50%; box-shadow: 0 0 60px rgba(138, 43, 226, 0.3), inset 0 0 40px rgba(0, 0, 0, 0.9); border: 5px solid rgba(138, 43, 226, 0.5); background: #0d041a; }
        #wheel-canvas { width: 100%; height: 100%; border-radius: 50%; display: block; }
        .wheel-center-cap { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 12%; height: 12%; background: radial-gradient(circle, #3b176b 0%, #110524 100%); border-radius: 50%; border: 2px solid rgba(216, 180, 254, 0.7); box-shadow: 0 0 20px rgba(138, 43, 226, 0.9); z-index: 10; }

        .wheel-pointer { position: absolute; top: -25px; left: 50%; transform: translateX(-50%); width: 36px; height: 45px; background: linear-gradient(to bottom, #f3e8ff, #9333ea); clip-path: polygon(50% 100%, 0 0, 100% 0); z-index: 20; filter: drop-shadow(0 0 12px rgba(216, 180, 254, 1)); animation: float-pointer 2s ease-in-out infinite; }
        @keyframes float-pointer { 0%, 100% { transform: translateX(-50%) translateY(0); filter: drop-shadow(0 0 10px rgba(216, 180, 254, 0.8)); } 50% { transform: translateX(-50%) translateY(-3px); filter: drop-shadow(0 0 18px rgba(216, 180, 254, 1)); } }

        .btn-spin { background: linear-gradient(135deg, rgba(107, 33, 168, 0.8), rgba(59, 7, 100, 0.9)); border: 1px solid rgba(216, 180, 254, 0.5); box-shadow: 0 4px 20px rgba(138, 43, 226, 0.4); transition: all 0.3s ease; position: relative; overflow: hidden; }
        .btn-spin::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: all 0.5s ease; }
        .btn-spin:hover:not(:disabled) { transform: translateY(-2px) scale(1.02); box-shadow: 0 6px 25px rgba(138, 43, 226, 0.7); border-color: rgba(216, 180, 254, 0.9); }
        .btn-spin:hover:not(:disabled)::before { left: 100%; }
        .btn-spin:active:not(:disabled) { transform: translateY(1px); }
        .btn-spin:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(0.5); box-shadow: none; }

        #result-overlay { z-index: var(--z-ui); }
        .modal-enter { animation: modalFadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes modalFadeInScale { 0% { opacity: 0; transform: scale(0.8) translateY(30px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }

        .btn-secondary { background: rgba(30, 10, 60, 0.6); border: 1px solid rgba(138, 43, 226, 0.4); transition: all 0.3s ease; }
        .btn-secondary:hover { background: rgba(50, 15, 90, 0.8); border-color: rgba(216, 180, 254, 0.6); }

        .history-item { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start relative">

    <script>
        const QUESTIONS = 


[
  { "id": 1, "title": "Əgər heç kimin heç vaxt xəbər tutmayacağına əmin olduğun bir səhv etsən, yenə də vicdan əzabı çəkərdin, yoxsa səhvin yalnız aşkar olunanda əhəmiyyət daşıdığını düşünürsən?" },
  { "id": 2, "title": "Bir insan səni haqsız yerə günahlandırsa və həqiqəti sübut etmək üçün onun ən böyük sirrini açmalı olsan, özünü müdafiə edərdin, yoxsa sirri qoruyardın?" },
  { "id": 3, "title": "Əgər xarakterinin ən pis xüsusiyyətini hamı bilsəydi, insanların sənə münasibətinin necə dəyişəcəyindən qorxardın? Həmin xüsusiyyət nədir?" },
  { "id": 4, "title": "Heç kiminsə uğuruna ürəkdən sevinmək istədiyin halda daxilində kiçik bir paxıllıq hiss etmisən? Bu hissə necə reaksiya vermisən?" },
  { "id": 5, "title": "Bir mübahisədə haqlı olduğunu bilsən, amma haqlı çıxmağın qarşındakı insanı çox incidəcəksə, həqiqəti sübut edərdin, yoxsa susardın?" },
  { "id": 6, "title": "Əgər keçmişdə incitdiyin bir insanla yenidən qarşılaşsan və o səni hələ də bağışlamasa, özünü müdafiə etmədən onun dediklərini dinləyə bilərdin?" },
  { "id": 7, "title": "İnsanların səndə yaxşı xüsusiyyət hesab etdiyi, amma əslində qorxularından yaranan bir davranışın varmı?" },
  { "id": 8, "title": "Əgər ən yaxın insanın sənə qarşı səhv etsə, amma bunu etiraf etməyə cəsarəti çatmasa, onun etirafını gözləyərdin, yoxsa bildiyini özün söyləyərdin?" },
  { "id": 9, "title": "Həyatında verdiyin hansı qərarı bu gün də düzgün hesab edirsən, amma yenə də verdiyinə görə peşmanlıq hiss edirsən?" },
  { "id": 10, "title": "Əgər bir gün özünlə dost olmalı olsan, səninlə dostluq etməyin ən yorucu və ən çətin tərəfi nə olardı?" },
  { "id": 11, "title": "Səncə, insanın həqiqi xarakteri güc sahibi olanda üzə çıxır, yoxsa heç nəyi idarə edə bilməyəndə? Özündən nümunə göstər." },
  { "id": 12, "title": "Heç kiməsə üzr istəməli olduğunu bilib, sırf qürurun imkan vermədiyi üçün bunu günlərlə gecikdirmisən?" },
  { "id": 13, "title": "Əgər öz xarakterində yalnız bir şeyi dəyişmək imkanın olsa, səni daha çox sevilən biri edəcək xüsusiyyəti seçərdin, yoxsa özünü daha xoşbəxt edəcək xüsusiyyəti?" },
  { "id": 14, "title": "Sənə qarşı edilən hansı davranışı başqalarına bağışlamaq asandır, amma özün eyni şeyi edəndə özünü bağışlaya bilmirsən?" },
  { "id": 15, "title": "Əgər səninlə bağlı hamının yanlış bildiyi bir həqiqət varsa, niyə indiyə qədər onu düzəltməmisən?" },
  { "id": 16, "title": "Bir insanın zəif nöqtəsini öyrənsən və mübahisə zamanı həmin nöqtəyə toxunmaqla qalib gələ bilsən, əsəbi olduğun anda özünü saxlaya bilərdin?" },
  { "id": 17, "title": "Heç başqasını ittiham etdiyin bir davranışı sonradan özünün də etdiyini anlayıb, bunu heç kimə etiraf etməmisən?" },
  { "id": 18, "title": "Əgər səni sevən insanların hamısı sənin ən qaranlıq düşüncələrini bilsəydi, onların yenə də yanında qalacağına nə qədər inanardın?" },
  { "id": 19, "title": "Bir insan sənə çox güvənsə, amma sən onun güvəninə layiq olmadığını hiss etsən, bunu etiraf edərdin, yoxsa daha yaxşı insan olmağa çalışardın?" },
  { "id": 20, "title": "Səncə, özünü pis insan hesab etmədən etdiyin ən eqoist hərəkət nə olub?" },
  { "id": 21, "title": "Bir insan sənin ən böyük səhvini üzünə desə, ilk reaksiyan özünü müdafiə etmək olar, yoxsa həmin səhvin həqiqətən mövcud olub-olmadığını düşünmək?" },
  { "id": 22, "title": "Əgər çox sevdiyin bir insanın xoşbəxtliyi sənin həyatından uzaqlaşmasından asılı olsa, onun qərarına hörmət edə bilərdin?" },
  { "id": 23, "title": "Səncə, insanların sənə qarşı etdiyi səhvləri həqiqətən bağışlayırsan, yoxsa sadəcə həmin səhvləri lazım olana qədər yadda saxlayırsan?" },
  { "id": 24, "title": "Birinin sənə ehtiyacı olduğunu bilməkdən xoşun gəlir, yoxsa bu hiss bəzən qarşındakı insan üzərində güc sahibi olduğunu düşündürür?" },
  { "id": 25, "title": "Əgər öz xarakterinin başqalarına göstərdiyin tərəfi ilə tək qalanda yaşadığın tərəfi qarşılaşsa, səncə, bir-birlərini bəyənərdilər?" },
  { "id": 26, "title": "Heç birinin xəbəri olmadan iki yaxın insanın arasında seçim etməli olsan, seçimində daha çox sədaqət, ədalət, yoxsa şəxsi maraqların rol oynayardı?" },
  { "id": 27, "title": "Səncə, özünü qorumaq üçün etdiyin hansı davranış bəzən səni sevən insanları səndən uzaqlaşdırır?" },
  { "id": 28, "title": "Bir insan səni çox yaxşı tanıdığı üçün mübahisədə həmişə zəif nöqtələrini görə bilsə, onunla mübahisə edərkən nə dərəcədə dürüst qala bilərdin?" },
  { "id": 29, "title": "Əgər etdiyin yaxşılıqları heç kim heç vaxt bilməsə və sənə təşəkkür edilməsə, yenə də eyni dərəcədə yaxşılıq edərdin?" },
  { "id": 30, "title": "Özündə nifrət etdiyin bir xüsusiyyəti başqa insanda görəndə ona qarşı daha anlayışlı olursan, yoxsa daha sərt davranırsan?" },
  { "id": 31, "title": "Səncə, hansı hallarda həqiqəti söyləmək əvəzinə susmaq daha böyük xəyanət hesab oluna bilər?" },
  { "id": 32, "title": "Əgər keçmişindəki özün indiki səni görə bilsəydi, hansı xüsusiyyətini itirdiyinə görə sənə əsəbiləşərdi?" },
  { "id": 33, "title": "Bir insan səni çox sevsə, amma sənin onu sevmədiyin qədər sevsə, bu fərqdən öz xeyrinə istifadə etməmək üçün necə davranardın?" },
  { "id": 34, "title": "Səncə, hansı daha çətindir: səhv etdiyini etiraf etmək, yoxsa haqlı olduğun bir mövzuda qarşındakı insanın hisslərini də nəzərə almaq?" },
  { "id": 35, "title": "Əgər bir insan səni tənqid edəndə içindən dərhal onu da tənqid etmək keçirsə, bu, sənin xarakterin haqqında nə göstərir?" },
  { "id": 36, "title": "Həyatında heç kimə göstərmədiyin, çünki göstərsən insanların səndən istifadə edəcəyini düşündüyün hansı həssas tərəfin var?" },
  { "id": 37, "title": "Əgər bir mübahisədə qarşındakı insan ağlasa, mövzunu həll etməyə davam edərdin, yoxsa əvvəlcə onun sakitləşməsinə kömək edərdin?" },
  { "id": 38, "title": "Heç özünü qurban kimi göstərib, əslində hadisədə özünün də günahkar olduğunu bildiyin bir vəziyyət yaşayıbsan?" },
  { "id": 39, "title": "Bir insan sənə heç vaxt edə bilməyəcəyin bir yaxşılıq etsə, ona ömürlük borclu hiss edərdin, yoxsa sevgini borc kimi görməyi düzgün hesab etmirsən?" },
  { "id": 40, "title": "Səncə, sənin xarakterində ən çox hansı hiss qərarlarını idarə edir: qorxu, qürur, sevgi, məntiq, yoxsa təsdiqlənmək ehtiyacı?" },
  { "id": 41, "title": "Əgər hamının səni sevməsi üçün bir prinsipindən imtina etməli olsan, hansı prinsipindən heç vaxt vaz keçməzdin?" },
  { "id": 42, "title": "Səncə, bir insanla münasibətin pozulanda ən çox öz səhvlərini xatırlayırsan, yoxsa onun sənə etdiklərini?" },
  { "id": 43, "title": "Heç kiminsə sənə olan sevgisinin azaldığını hiss edib, onun diqqətini qaytarmaq üçün bilərəkdən fərqli davrandığın olub?" },
  { "id": 44, "title": "Əgər bir gün bütün bəhanələrini əlindən alsalar, həyatındakı hansı uğursuzluğun məsuliyyətini tamamilə öz üzərinə götürməli olardın?" },
  { "id": 45, "title": "Bir insanın sənə xəyanət etdiyini öyrənsən, onu bağışlaya bilməyəcəyin üçün daha çox üzülərdin, yoxsa ona əvvəlki kimi güvənə bilməyəcəyin üçün?" },
  { "id": 46, "title": "Səncə, insanların sənin haqqında bilmədiyi ən böyük ziddiyyət nədir? Məsələn, bir tərəfdən çox güclü görünmək, digər tərəfdən çox həssas olmaq kimi." },
  { "id": 47, "title": "Əgər ən sevdiyin insan sənə 'sənin bu xüsusiyyətin məni incidir' desə, həmin xüsusiyyətini dəyişməyə çalışardın, yoxsa əvvəlcə onun səni olduğu kimi qəbul etməsini gözləyərdin?" },
  { "id": 48, "title": "Özünü ən çox hansı vəziyyətdə tanıya bilmirsən: çox əsəbiləşəndə, qısqananda, qorxanda, yoxsa kiməsə həddindən artıq bağlananda?" },
  { "id": 49, "title": "Səncə, ən yaxın insanların sənin haqqında danışanda 'onun ən böyük problemi budur' deyə biləcəyi xüsusiyyətin hansıdır?" },
  { "id": 50, "title": "Əgər mən sənin xarakterinin bütün yaxşı və pis tərəflərini heç bir mühakimə etmədən dinləyə bilsəm, mənə etiraf etməkdə ən çox çətinlik çəkəcəyin həqiqət nə olardı?" },
  { "id": 51, "title": "Mənimlə tək qaldığın hansı anda içindən keçən romantik düşüncəni gizlətmək üçün özünü başqa bir şeylə məşğul göstərmisən?" },
  { "id": 52, "title": "Əgər mən sənin mənə qarşı hiss etdiyin cazibəni bir anlıq görə bilsəydim, ən çox hansı görüşümüzdə və hansı saniyədə görünərdi?" },
  { "id": 53, "title": "Mənimlə bağlı hansı romantik istəyini mənə deməyə utanırsan, çünki onun sənin üçün nə qədər şəxsi olduğunu anlayacağımdan çəkinirsən?" },
  { "id": 54, "title": "Əgər ikimiz tək olanda mən sənə 'mənim haqqımda düşündüyün ən cəsarətli fikri de' desəm, ilk ağlına gələn, amma deməyə çəkinəcəyin cümlə nə olar?" },
  { "id": 55, "title": "Mənim hansı fiziki detalıma baxanda ağlından keçən komplimenti indiyə qədər deməmisən və bunu indi necə ifadə edərdin?" },
  { "id": 56, "title": "Əgər mənimlə bağlı bütün romantik xəyallarının arasından birini seçib gerçəkləşdirmək imkanın olsa, nəyi seçərdin və niyə məhz onu?" },
  { "id": 57, "title": "Heç mənimlə eyni məkanda oturarkən aramızdakı sükutun adi sükut olmadığını hiss etmisən? Həmin anda nə düşünürdün?" },
  { "id": 58, "title": "Mənim sənə indiyə qədər söylədiyim hansı romantik cümləni yenidən, amma bu dəfə yalnız ikimiz tək olanda eşitmək istəyərdin?" },
  { "id": 59, "title": "Əgər mənim sənin haqqında düşündüyüm ən şəxsi romantik fikri öyrənmək imkanın olsa, hansı mövzuda olmasını istəyərdin?" },
  { "id": 60, "title": "Mənimlə hansısa romantik anı yaşadıqdan sonra evə gedib onu xəyalında yenidən canlandırmısan? Həmin səhnənin hansı detalı yadında qalıb?" },
  { "id": 61, "title": "Əgər mən sənin qulağına yalnız ikimizin eşidəcəyi bir cümlə pıçıldasam, hansı sözləri eşitmək səni şirin şəkildə utandırardı?" },
  { "id": 62, "title": "Mənimlə bağlı hansı yaxınlıq formasını özün üçün ən özəl hesab edirsən və bunu başqalarına izah etmək sənə niyə çətin gələrdi?" },
  { "id": 63, "title": "Əgər bir gün romantik bir görüşün bütün qaydalarını sən müəyyən etsən, mənim ən çox hansı davranışımı istəyər, hansını isə istəməzdin?" },
  { "id": 64, "title": "Mənimlə bağlı hansı xəyalını ən yaxın rəfiqən belə bilsə, utanıb söhbəti dərhal dəyişmək istəyərdin?" },
  { "id": 65, "title": "Əgər mənimlə beş dəqiqə ərzində yalnız bir-birimizə səmimi komplimentlər etməli olsaq, mənə deməyə ən çox utanacağın kompliment nə olardı?" },
  { "id": 66, "title": "Mənim hansı baxışım sənə eyni anda həm rahatlıq, həm də izah edə bilmədiyin romantik həyəcan hiss etdirir?" },
  { "id": 67, "title": "Əgər sevgililikdə özünü heç bir fiziki təmasa ehtiyac olmadan çox yaxın hiss etdiyin bir səhnə yaratmalı olsan, həmin səhnə necə olardı?" },
  { "id": 68, "title": "Mənimlə bağlı hansı şəxsi arzunu mən özüm təsadüfən başa düşsəm, sən bunu etiraf etmək əvəzinə utanıb gülümsəyərdin?" },
  { "id": 69, "title": "Əgər ikimiz bir gecə bütün utancaqlığımızı kənara qoyaraq romantik mövzularda danışsaq, mənə verəcəyin ən gözlənilməz sual nə olardı?" },
  { "id": 70, "title": "Mənim sənə yaxın olduğum hansı anda özünü daha çox həyəcanlı hiss etmisən və bu həyəcanı mənə bildirmisən, yoxsa gizlətmisən?" },
  { "id": 71, "title": "Əgər mən sənin romantik düşüncələrini yalnız bir dəqiqə oxuya bilsəydim, həmin dəqiqədə mənimlə bağlı hansı sirrinin üzə çıxmasından utanardın?" },

    <div class="w-full max-w-4xl mx-auto px-4 pt-16 pb-8 flex flex-col relative z-[30] min-h-screen">

                <button id="btn-close-result" class="btn-secondary text-purple-200 px-8 py-3 rounded-full font-medium tracking-wide w-full sm:w-auto text-sm">BAĞLA</button>

    <script>
        class BackgroundParticles {
            constructor() {
                this.canvas = document.getElementById('particle-canvas'); this.ctx = this.canvas.getContext('2d');
                this.particles = []; this.numParticles = window.innerWidth < 768 ? 60 : 150;
                this.resize(); window.addEventListener('resize', () => this.resize());
                this.initParticles(); this.animate();
            }
            resize() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; }
            initParticles() {
                this.particles = [];
                for (let i = 0; i < this.numParticles; i++) {
                    this.particles.push({ x: Math.random() * this.canvas.width, y: Math.random() * this.canvas.height, radius: Math.random() * 1.2 + 0.2, vx: (Math.random() - 0.5) * 0.15, vy: (Math.random() - 0.5) * 0.15, alpha: Math.random() * 0.5 + 0.1, pulseDir: Math.random() > 0.5 ? 1 : -1 });
                }
            }
            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.alpha += 0.005 * p.pulseDir;
                    if (p.alpha > 0.7) { p.alpha = 0.7; p.pulseDir = -1; } if (p.alpha < 0.1) { p.alpha = 0.1; p.pulseDir = 1; }
                    if (p.x < 0) p.x = this.canvas.width; if (p.x > this.canvas.width) p.x = 0;
                    if (p.y < 0) p.y = this.canvas.height; if (p.y > this.canvas.height) p.y = 0;
                    this.ctx.beginPath(); this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); this.ctx.fillStyle = `rgba(216, 180, 254, ${p.alpha})`; this.ctx.fill();
                });
                requestAnimationFrame(() => this.animate());
            }
        }

        class BurstParticles {
            constructor() { this.canvas = document.getElementById('burst-canvas'); this.ctx = this.canvas.getContext('2d'); this.particles = []; this.animating = false; }
            resize(w, h) { this.canvas.width = w; this.canvas.height = h; }
            trigger(x, y) {
                this.particles = [];
                for(let i=0; i<30; i++){
                    const angle = (Math.random() * Math.PI) + Math.PI; const speed = Math.random() * 3 + 1;
                    this.particles.push({ x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, radius: Math.random() * 2 + 1, alpha: 1, life: Math.random() * 0.02 + 0.01 });
                }
                if(!this.animating){ this.animating = true; this.animate(); }
            }
            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height); let alive = false;
                this.particles.forEach(p => {
                    if (p.alpha > 0) {
                        alive = true; p.x += p.vx; p.y += p.vy; p.alpha -= p.life;
                        this.ctx.beginPath(); this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); this.ctx.fillStyle = `rgba(216, 180, 254, ${Math.max(0, p.alpha)})`; this.ctx.fill();
                        this.ctx.shadowBlur = 5; this.ctx.shadowColor = '#d8b4fe';
                    }
                });
                if (alive) { requestAnimationFrame(() => this.animate()); } else { this.animating = false; this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height); }
            }
        }

        const StorageManager = {
            KEY: 'cosmic_wheel_recent',
            get: function() { try { return JSON.parse(localStorage.getItem(this.KEY)) || []; } catch(e) { return []; } },
            add: function(title) { let list = this.get(); if (list[0] !== title) { list.unshift(title); if (list.length > 5) list = list.slice(0, 5); localStorage.setItem(this.KEY, JSON.stringify(list)); } },
            render: function(containerId) {
                const container = document.getElementById(containerId); const list = this.get(); container.innerHTML = '';
                if (list.length === 0) { container.innerHTML = '<span class="text-xs text-purple-500/50">Hələ heç nə seçilməyib</span>'; return; }
                list.slice(0, 3).forEach((title, idx) => {
                    const span = document.createElement('span'); span.className = `history-item text-[11px] px-2 py-1 bg-purple-900/30 border border-purple-500/20 rounded-full text-purple-300`;
                    span.style.animationDelay = `${idx * 0.1}s`; span.textContent = title; container.appendChild(span);
                });
            }
        };

        class TodayChoiceApp {
            constructor() {
                this.items = QUESTIONS; 
                this.numSegments = this.items.length; 
                this.isSpinning = false; this.currentRotation = 0; this.lastSelectedIndex = -1; this.highlightedIndex = -1;
                this.colors = ['#1a0b2e', '#230f3f', '#120524']; 
                this.wheelCanvas = document.getElementById('wheel-canvas'); this.ctx = this.wheelCanvas.getContext('2d', { alpha: true });
                this.spinBtn = document.getElementById('spin-btn');
                this.resultOverlay = document.getElementById('result-overlay'); this.resultCard = document.getElementById('result-card');
                this.resultTitle = document.getElementById('result-title');
                this.btnCloseResult = document.getElementById('btn-close-result'); this.btnSpinAgain = document.getElementById('btn-spin-again');
                this.burstSystem = new BurstParticles();
                this.init();
            }
            init() {
                new BackgroundParticles(); StorageManager.render('history-list');
                this.setupCanvas(); window.addEventListener('resize', () => { this.setupCanvas(); this.drawWheel(); }); this.drawWheel();
                this.bindEvents();
            }
            setupCanvas() {
                const size = 1200; this.wheelCanvas.width = size; this.wheelCanvas.height = size;
                this.centerX = size / 2; this.centerY = size / 2; this.radius = size / 2 - 20;
                const rect = this.wheelCanvas.getBoundingClientRect(); this.burstSystem.resize(rect.width, rect.height);
            }
            drawWheel() {
                const { ctx, centerX, centerY, radius, numSegments, items, colors } = this;
                ctx.clearRect(0, 0, this.wheelCanvas.width, this.wheelCanvas.height); const arc = (Math.PI * 2) / numSegments; ctx.lineWidth = 1;
                for (let i = 0; i < numSegments; i++) {
                    const angle = i * arc - (Math.PI / 2); 
                    ctx.beginPath(); ctx.moveTo(centerX, centerY); ctx.arc(centerX, centerY, radius, angle, angle + arc); ctx.lineTo(centerX, centerY);
                    if (this.highlightedIndex === i) { ctx.fillStyle = '#4c1d95'; ctx.shadowBlur = 20; ctx.shadowColor = '#d8b4fe'; } else { ctx.fillStyle = colors[i % colors.length]; ctx.shadowBlur = 0; }
                    ctx.fill(); ctx.strokeStyle = 'rgba(138, 43, 226, 0.2)'; ctx.stroke(); ctx.shadowBlur = 0; 
                    ctx.save(); ctx.translate(centerX, centerY); ctx.rotate(angle + arc / 2); ctx.textAlign = "right"; ctx.textBaseline = "middle";
                    const text = "SUAL " + items[i].id;
                    ctx.fillStyle = (this.highlightedIndex === i) ? "#ffffff" : "rgba(233, 213, 255, 0.85)"; ctx.font = `600 11px 'Inter', sans-serif`;
                    ctx.fillText(text, radius - 15, 0, radius - 150); 
                    ctx.restore();
                }
            }
            bindEvents() {
                this.spinBtn.addEventListener('click', () => this.spin());
                this.btnSpinAgain.addEventListener('click', () => { this.closeResult(); setTimeout(() => this.spin(), 300); });
                this.btnCloseResult.addEventListener('click', () => this.closeResult());
                this.wheelCanvas.addEventListener('transitionend', () => this.onSpinComplete());
            }
            spin() {
                if (this.isSpinning) return; this.isSpinning = true; this.spinBtn.disabled = true; this.highlightedIndex = -1; this.drawWheel(); 
                
                let historyTitles = StorageManager.get();
                let historyIds = historyTitles.map(t => parseInt(t.replace('Sual #', '')));
                let availableIndices = this.items.map((_, i) => i).filter(i => !historyIds.includes(this.items[i].id));
                
                if (availableIndices.length === 0) availableIndices = this.items.map((_, i) => i).filter(i => i !== this.lastSelectedIndex);
                if (availableIndices.length === 0) availableIndices = [0];
                
                const targetIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)]; 
                this.lastSelectedIndex = targetIndex; this.currentSelectedActivity = this.items[targetIndex];
                const segmentAngle = 360 / this.numSegments; const targetAngleRel = 360 - (targetIndex * segmentAngle);
                const currentMod = this.currentRotation % 360; let rotateBy = targetAngleRel - currentMod;
                const extraSpins = (Math.floor(Math.random() * 4) + 5) * 360; this.currentRotation += (extraSpins + rotateBy);
                const duration = (Math.random() * 3 + 4).toFixed(2);
                this.wheelCanvas.style.transition = `transform ${duration}s cubic-bezier(0.15, 0.95, 0.25, 1)`; this.wheelCanvas.style.transform = `rotate(${this.currentRotation}deg)`;
            }
            onSpinComplete() {
                if (!this.isSpinning) return; this.isSpinning = false; this.highlightedIndex = this.lastSelectedIndex; this.drawWheel();
                const rect = document.getElementById('burst-canvas').getBoundingClientRect(); this.burstSystem.trigger(rect.width / 2, 20);
                StorageManager.add('Sual #' + this.currentSelectedActivity.id); StorageManager.render('history-list');
                setTimeout(() => this.showResult(this.currentSelectedActivity), 600);
            }
            showResult(activity) {
                this.resultTitle.textContent = activity.title;
                this.resultOverlay.classList.remove('hidden'); this.resultOverlay.classList.add('flex');
                this.resultCard.classList.remove('modal-enter'); void this.resultCard.offsetWidth; this.resultCard.classList.add('modal-enter');
            }
            closeResult() { this.resultOverlay.classList.add('hidden'); this.resultOverlay.classList.remove('flex'); this.spinBtn.disabled = false; }
        }
        document.addEventListener('DOMContentLoaded', () => { new TodayChoiceApp(); });
    </script>

    <!-- Kəsilməz Qlobal Musiqi Sistemi -->
    <script>
        window.GlobalAudio = (function() {
            if(window.__globalAudio) return window.__globalAudio;
            const audio = new Audio();
            audio.loop = true;
            const state = JSON.parse(localStorage.getItem('cosmic_audio_state')) || { src: '', time: 0, isPlaying: false };
            if (state.src) {
                audio.src = state.src;
                audio.currentTime = state.time;
                if (state.isPlaying) {
                    audio.play().catch(e => {
                        const resume = () => { audio.play(); document.removeEventListener('click', resume); };
                        document.addEventListener('click', resume, {once: true});
                        document.addEventListener('touchstart', resume, {once: true});
                    });
                }
            }
            setInterval(() => {
                if(!audio.paused && audio.src) {
                    localStorage.setItem('cosmic_audio_state', JSON.stringify({src: audio.src, time: audio.currentTime, isPlaying: true}));
                }
            }, 1000);
            window.addEventListener('beforeunload', () => {
                if(audio.src) localStorage.setItem('cosmic_audio_state', JSON.stringify({src: audio.src, time: audio.currentTime, isPlaying: !audio.paused}));
            });
            window.addEventListener('storage', (e) => {
                if(e.key === 'cosmic_audio_state' && e.newValue) {
                    const newState = JSON.parse(e.newValue);
                    if(!newState.isPlaying && !audio.paused) audio.pause();
                    if(newState.isPlaying && audio.paused && audio.src.endsWith(newState.src)) audio.play().catch(()=>{});
                }
            });
            window.__globalAudio = audio;
            return audio;
        })();
    </script>
