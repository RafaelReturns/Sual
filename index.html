<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>100 Sual | Cosmic Decision Wheel</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cosmic-bg: #070311;
            --purple-glow: rgba(138, 43, 226, 0.5);
            --lavender: #d8b4fe;
            --dark-glass: rgba(20, 10, 40, 0.65);
            --z-bg: 0;
            --z-particles: 10;
            --z-wheel: 20;
            --z-ui: 30;
        }

        body {
            background-color: var(--cosmic-bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .cinzel { font-family: 'Cinzel', serif; }

        #particle-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: var(--z-bg); background: radial-gradient(circle at center, #0f051c 0%, #05010a 100%); pointer-events: none; }
        #particle-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: var(--z-particles); pointer-events: none; }
        #burst-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 25; }

        .glass-panel { background: var(--dark-glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(168, 85, 247, 0.3); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), 0 0 20px rgba(138, 43, 226, 0.15); }
        .text-glow { text-shadow: 0 0 15px rgba(216, 180, 254, 0.7); }

        .wheel-wrapper { position: relative; width: 100%; max-width: 550px; aspect-ratio: 1 / 1; margin: 0 auto; z-index: var(--z-wheel); display: flex; align-items: center; justify-content: center; }
        .wheel-container { position: relative; width: 90%; height: 90%; border-radius: 50%; box-shadow: 0 0 60px rgba(138, 43, 226, 0.3), inset 0 0 40px rgba(0, 0, 0, 0.9); border: 5px solid rgba(138, 43, 226, 0.5); background: #0d041a; }
        #wheel-canvas { width: 100%; height: 100%; border-radius: 50%; display: block; }
        .wheel-center-cap { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 12%; height: 12%; background: radial-gradient(circle, #3b176b 0%, #110524 100%); border-radius: 50%; border: 2px solid rgba(216, 180, 254, 0.7); box-shadow: 0 0 20px rgba(138, 43, 226, 0.9); z-index: 10; }

        .wheel-pointer { position: absolute; top: -25px; left: 50%; transform: translateX(-50%); width: 36px; height: 45px; background: linear-gradient(to bottom, #f3e8ff, #9333ea); clip-path: polygon(50% 100%, 0 0, 100% 0); z-index: 20; filter: drop-shadow(0 0 12px rgba(216, 180, 254, 1)); animation: float-pointer 2s ease-in-out infinite; }
        @keyframes float-pointer { 0%, 100% { transform: translateX(-50%) translateY(0); filter: drop-shadow(0 0 10px rgba(216, 180, 254, 0.8)); } 50% { transform: translateX(-50%) translateY(-3px); filter: drop-shadow(0 0 18px rgba(216, 180, 254, 1)); } }

        .btn-spin { background: linear-gradient(135deg, rgba(107, 33, 168, 0.8), rgba(59, 7, 100, 0.9)); border: 1px solid rgba(216, 180, 254, 0.5); box-shadow: 0 4px 20px rgba(138, 43, 226, 0.4); transition: all 0.3s ease; position: relative; overflow: hidden; }
        .btn-spin::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: all 0.5s ease; }
        .btn-spin:hover:not(:disabled) { transform: translateY(-2px) scale(1.02); box-shadow: 0 6px 25px rgba(138, 43, 226, 0.7); border-color: rgba(216, 180, 254, 0.9); }
        .btn-spin:hover:not(:disabled)::before { left: 100%; }
        .btn-spin:active:not(:disabled) { transform: translateY(1px); }
        .btn-spin:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(0.5); box-shadow: none; }

        #result-overlay { z-index: var(--z-ui); }
        .modal-enter { animation: modalFadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes modalFadeInScale { 0% { opacity: 0; transform: scale(0.8) translateY(30px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }

        .btn-secondary { background: rgba(30, 10, 60, 0.6); border: 1px solid rgba(138, 43, 226, 0.4); transition: all 0.3s ease; }
        .btn-secondary:hover { background: rgba(50, 15, 90, 0.8); border-color: rgba(216, 180, 254, 0.6); }

        .history-item { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start relative">

    <script>
        const QUESTIONS = 

[
  { "id": 1, "title": "Məni başqa bir qız çox güldürsə və mən də onunla zarafatlaşsam, içindən keçən, amma üzümə deməyəcəyin ilk cümlə nə olar?" },
  { "id": 2, "title": "Heç məni qısqanıb, sonra qısqandığını etiraf etməmək üçün tamamilə başqa mövzudan söhbət açmısan?" },
  { "id": 3, "title": "Bir qız sənə gəlib məni çox yaraşıqlı hesab etdiyini desə, ona verəcəyin ən qısqanc, amma mədəni cavab nə olardı?" },
  { "id": 4, "title": "Əgər keçmişdə məni gizlicə sevmiş bir qızla tanış olsan, onun haqqında ilk nəyi bilmək istəyərdin?" },
  { "id": 5, "title": "Səncə, mənim hansı xüsusiyyətim başqa qızları ən çox cəlb edə bilər və həmin xüsusiyyətimə görə məni heç qısqanmısan?" },
  { "id": 6, "title": "Mənim başqa bir qızdan kompliment aldığımı görsən, daha çox mənim cavabımı izləyərsən, yoxsa həmin qızın reaksiyasını?" },
  { "id": 7, "title": "Heç məni qısqandığın üçün əslində vermək istəmədiyin bir sualı verib, sonra özünü ələ verdiyini düşünmüsən?" },
  { "id": 8, "title": "Əgər bir qız mənə 'sevgilin olmasaydı, səninlə görüşmək istəyərdim' desə, mənim ona nə cavab verməyimi istəyərdin?" },
  { "id": 9, "title": "Mənim keçmişdə başqa birinə romantik sözlər söyləmiş ola biləcəyimi düşünəndə hansı hissi keçirirsən?" },
  { "id": 10, "title": "Heç məni qısqandığın halda içindən 'mən niyə bu qədər qısqanıram?' deyib öz hisslərinə təəccüblənmisən?" },
  { "id": 11, "title": "Bir qız mənə sənin də işlətdiyin romantik bir ləqəblə müraciət etsə, bunu nə qədər qəribə qarşılayardın?" },
  { "id": 12, "title": "Mənim hansı qızla bağlı hansı mövzuda uzun söhbət etməyim səni istəmədən qısqandıra bilər?" },
  { "id": 13, "title": "Mənim başqa bir qızı çox ağıllı və maraqlı insan hesab etməyim səndə qısqanclıq yaradar, yoxsa bunu tam normal qarşılayarsan?" },
  { "id": 14, "title": "Əgər bir qız mənə 'kaş sənin kimi sevgilim olaydı' desə, sənin ona demək istəyəcəyin ən şirin cavab nə olardı?" },
  { "id": 15, "title": "Məni qısqandığın zaman daha çox mənim bunu hiss edib səni sakitləşdirməyimi istəyirsən, yoxsa özün gəlib danışmağı?" },
  { "id": 16, "title": "Əgər bir qız mənim gülüşümə aşiq olduğunu desə, ilk reaksiyan nə olar? Zarafatsız cavab ver." },
  { "id": 17, "title": "Mənim başqa bir qızla çox ortaq maraqlarımın olduğunu öyrənsən, bu səni narahat edər? Niyə?" },
  { "id": 18, "title": "Səncə, mən səni qısqananda daha çox şirin görünürəm, yoxsa özümü gülməli vəziyyətə salıram?" },
  { "id": 19, "title": "Məni indiyə qədər ən çox qısqandığın konkret hadisə hansı olub və həmin vaxt əslində nə düşünürdün?" },
  { "id": 20, "title": "Əgər bir qız mənə romantik mesaj göndərsə, mənim hansı cavabım sənə özünü ən güvəndə hiss etdirərdi?" },
  { "id": 21, "title": "Səncə, ikimizdən hansımız qısqandığını gizlətməkdə daha pisdir? Bunun sübutu olan bir hadisə danış." },
  { "id": 22, "title": "Mənim hansı romantik davranışımı başqa bir qıza göstərməyim sənin üçün qəbuledilməz olardı?" },
  { "id": 23, "title": "Heç məni qısqanıb, sonra mənə daha çox diqqət göstərmək və ya naz etmək istəmisən?" },
  { "id": 24, "title": "Əgər başqa bir qız məni səndən daha yaxşı tanıdığını iddia etsə, bunu sübut etmək üçün mənim haqqımda hansı sualı verərdin?" },
  { "id": 25, "title": "Mənə qarşı indiyə qədər yaşadığın ən absurd, ən səbəbsiz, amma etiraf etməyə utandığın qısqanclıq düşüncən nə olub?" },
  { "id": 26, "title": "Əgər bir gün mən pişiyə səndən daha çox diqqət göstərsəm, pişiyə qısqanarsan, yoxsa ikimizi də evdən qovarsan?" },
  { "id": 27, "title": "Mənim beynimdə yalnız üç fikir yaşasaydı, səncə, onlar nə olardı?" },
  { "id": 28, "title": "Əgər bir gün mənim bütün mesajlarımı sənin səsinlə oxuyan telefon proqramı yaradılsa, ilk hansı mesajım gülməli səslənərdi?" },
  { "id": 29, "title": "Evlənsək və ilk dəfə birlikdə yemək bişirsək, mətbəxi hansımız dağıdar və günahı kimin üstünə atardıq?" },
  { "id": 30, "title": "Mənim hansı xasiyyətimə baxıb 'bu oğlanı çox sevirəm, amma bəzən dözmək mümkün deyil' deyirsən?" },
  { "id": 31, "title": "Əgər bir gün mən sənin bütün danışıq tərzini və mimikalarını təqlid etsəm, ən çox hansı hərəkətimə gülərdin?" },
  { "id": 32, "title": "Mənimlə sevgili olduğun üçün indiyə qədər hansı ən gülməli vəziyyətə düşmüsən?" },
  { "id": 33, "title": "Əgər mən bir gün çox romantik olmaq istəyib hər şeyi korlasam, məni təsəlli edərsən, yoxsa illərlə həmin hadisəni xatırladarsan?" },
  { "id": 34, "title": "Səncə, gələcəkdə uşaqlarımız olsa, hansımız daha ciddi valideyn, hansımız isə uşaqlarla birlikdə dəcəllik edən tərəf olarıq?" },
  { "id": 35, "title": "Əgər məni bir günlüyə idarə edən pultun olsaydı, hansı üç düyməni əlavə edərdin?" },
  { "id": 36, "title": "Mənim hansı romantik cümləmi eşidəndə içindən 'yenə başladı bu' deyirsən, amma gizlicə xoşuna gəlir?" },
  { "id": 37, "title": "Əgər biz bir komediya serialının baş qəhrəmanları olsaq, ən çox hansı xasiyyətimizə görə tamaşaçılar gülərdi?" },
  { "id": 38, "title": "Məni dostlarına yalnız üç gülməli cümlə ilə təsvir etməli olsan, nə deyərdin?" },
  { "id": 39, "title": "Əgər məni beş yaşlı uşaq kimi bir gün sənə tapşırsaydılar, ilk hansı dəcəlliyimə görə məni danlayardın?" },
  { "id": 40, "title": "İkimiz bir qorxu filmində olsaq, hansımız birinci qışqırar, hansımız isə qorxmadığını deyib yalan danışardı?" },
  { "id": 41, "title": "Mənim hansı zarafatıma əslində gülmək istəməsən də, çox şirin göründüyüm üçün gülmüsən?" },
  { "id": 42, "title": "Əgər bizim münasibətimiz üçün çox gülməli bir xəbər başlığı yazılsaydı, həmin başlıq nə olardı?" },
  { "id": 43, "title": "Evlənsək, səncə, evdə ən çox hansı mənasız şeyə görə mübahisə edib sonra birlikdə gülərdik?" },
  { "id": 44, "title": "Əgər mənə ömürlük qəribə, utandırıcı, amma sevgi dolu bir ləqəb qoymalı olsan, nə seçərdin?" },
  { "id": 45, "title": "Mənim haqqımda indiyə qədər düşündüyün, amma üzümə demədiyin ən gülməli və bir az da həyasız zarafat nədir?" },
  { "id": 46, "title": "Mənimlə ilk dəfə öpüşmək haqqında düşündüyün anı xatırlayırsan? O anda ağlından konkret nə keçmişdi?" },
  { "id": 47, "title": "Heç mənə baxanda məni öpmək istəyib, utandığın üçün tamam başqa mövzudan danışmağa başlamısan?" },
  { "id": 48, "title": "Mənim hansı fiziki xüsusiyyətimi ən çox bəyənirsən, amma bunu üzümə deməyə utanırsan?" },
  { "id": 49, "title": "Əgər mən səndən indiyə qədər xəyal etdiyin ən romantik öpüş səhnəsini danışmağını istəsəm, həmin səhnə necə olardı?" },
  { "id": 50, "title": "Mənimlə qucaqlaşdığın zaman ağlından keçən, amma heç vaxt mənə demədiyin bir düşüncə varmı?" },
  { "id": 51, "title": "Əgər bir gün mənə qarşı bütün utancaqlığın yox olsa, ilk hansı romantik hərəkəti etmək istəyərdin?" },
  { "id": 52, "title": "Mənim hansı baxışım səni daha çox utandırır və həmin an beynində nə baş verir?" },
  { "id": 53, "title": "Heç məni öpəndən sonra öz-özünə gülümsəyib həmin anı yenidən xatırladığın olub? Nə düşünürdün?" },
  { "id": 54, "title": "Əgər mən sənə beş dəqiqə ərzində yalnız romantik komplimentlər söyləsəm, neçə dəqiqədən sonra üzünü gizlətməyə başlayarsan?" },
  { "id": 55, "title": "Mənim sənə nə deməyim səni o qədər utandırar ki, cavab vermək əvəzinə sadəcə gülümsəyərsən?" },
  { "id": 56, "title": "Heç mənimlə bağlı gecə yatmazdan əvvəl xəyal etdiyin bir romantik səhnə olub? İndi onu danışmağa cəsarətin çatır?" },
  { "id": 57, "title": "Əgər mən səndən məni ən çox harada öpməyi xoşladığını soruşsam, birbaşa cavab verə bilərsən?" },
  { "id": 58, "title": "Mənimlə yan-yana oturarkən heç mənə daha yaxınlaşmaq istəyib ilk addımı mənim atmağımı gözləmisən?" },
  { "id": 59, "title": "Əgər mən bir gün qulağına romantik bir cümlə pıçıldasam, hansı sözləri eşitmək səni ən çox utandırardı?" },
  { "id": 60, "title": "Mənimlə bağlı indiyə qədər özünə belə etiraf etməkdə çətinlik çəkdiyin ən utandırıcı romantik xəyal nədir?" },
  { "id": 61, "title": "Mənə qarşı hansı romantik istəyini həmişə mənim özüm başa düşməyimi gözləyirsən?" },
  { "id": 62, "title": "Əgər mən gözlərinin içinə baxıb 'indi məni öpmək istəyirsən?' desəm, reaksiyan necə olardı?" },
  { "id": 63, "title": "Heç mənim hansısa şəklimə normaldan daha uzun baxdığın olub? Həmin şəkildə diqqətini ən çox nə çəkmişdi?" },
  { "id": 64, "title": "Mənim hansı hərəkətim səndə bir anda romantik həyəcan yaradır, amma bunu mən heç hiss etmirəm?" },
  { "id": 65, "title": "Əgər birlikdə bütün günü yalnız romantik bir görüşə ayırsaq, günün ən çox hansı hissəsini səbirsizliklə gözləyərdin?" },
  { "id": 66, "title": "Heç mənimlə uzun müddət qucaqlaşmaq istəyib, bunu çox şirin və ya utandırıcı hesab etdiyin üçün deməmisən?" },
  { "id": 67, "title": "Əgər bir gün mən səndən məni niyə öpməyi sevdiyini bütün detalları ilə izah etməyini istəsəm, bunu bacararsan?" },
  { "id": 68, "title": "Mənim hansı komplimentim sənin beynində saatlarla təkrarlanıb və səni öz-özünə gülümsədib?" },
  { "id": 69, "title": "Səncə, ikimizdən hansı romantik yaxınlıq zamanı daha tez utanır və bunu gizlətmək üçün nə edir?" },
  { "id": 70, "title": "Əgər mənimlə bağlı yalnız bir romantik xəyalını sabah gerçəkləşdirmək imkanın olsa, hansını seçərdin?" },
  { "id": 71, "title": "Heç mənimlə vidalaşanda əslində ayrılmaq istəməyib, daha bir neçə dəqiqə birlikdə qalmaq üçün bəhanə axtarmısan?" },
  { "id": 72, "title": "Mənim hansı fiziki yaxınlığım səni daha çox rahatladır, hansı isə şirin şəkildə həyəcanlandırır?" },
  { "id": 73, "title": "Əgər mən sənə 'indiyə qədər mənimlə bağlı düşündüyün ən cəsarətli romantik fikri de' desəm, nə cavab verərdin?" },
  { "id": 74, "title": "Heç mənə deməyə utandığın üçün zarafata çevirdiyin bir romantik istəyin olub? Əslində nə istəyirdin?" },
  { "id": 75, "title": "İndi mənim gözlərimin içinə baxıb heç vaxt demədiyin ən utandırıcı, amma tamamilə səmimi romantik komplimenti etməli olsan, nə deyərdin?" },
  { "id": 76, "title": "Mənimlə sevgili olduğumuz gündən bəri mənə qarşı hisslərində baş verən, amma hələ mənə danışmadığın ən böyük dəyişiklik nədir?" },
  { "id": 77, "title": "Heç mənə baxanda içindən 'mən bu insanı düşündüyümdən də çox sevirəm' dediyin an olub? Həmin anda nə baş vermişdi?" },
  { "id": 78, "title": "Mənimlə bağlı gələcəkdə yaşamaq istədiyin, amma çox ciddi səslənəcəyindən qorxduğun üçün demədiyin bir xəyalın varmı?" },
  { "id": 79, "title": "Mənim sənin həyatındakı yerimi indiyə qədər heç işlətmədiyin üç çox şəxsi sözlə təsvir etməli olsan, hansı sözləri seçərdin?" },
  { "id": 80, "title": "Heç mənimlə yaşadığın adi bir an sonradan sənin üçün o qədər dəyərli olub ki, onu təkrar-təkrar xatırlamısan?" },
  { "id": 81, "title": "Mənimlə bağlı ən çox nədən qorxursan: məni itirməkdən, məni incitməkdən, yoxsa hisslərinin böyüklüyünü göstərməkdən?" },
  { "id": 82, "title": "Əgər bir gün mən sənin mənə qarşı bütün gizli hisslərini oxuya bilsəm, ən çox hansı həqiqətinə təəccüblənərdim?" },
  { "id": 83, "title": "Mənim hansı davranışım səndə 'yaxşı ki, məhz bu insanı seçmişəm' düşüncəsini yaradıb?" },
  { "id": 84, "title": "Heç gələcəkdə mənimlə eyni evdə yaşadığını təsəvvür etmisən? Həmin xəyalda ən çox hansı xırda detal səni xoşbəxt edir?" },

    <script>
        class BackgroundParticles {
            constructor() {
                this.canvas = document.getElementById('particle-canvas'); this.ctx = this.canvas.getContext('2d');
                this.particles = []; this.numParticles = window.innerWidth < 768 ? 60 : 150;
                this.resize(); window.addEventListener('resize', () => this.resize());
                this.initParticles(); this.animate();
            }
            resize() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; }
            initParticles() {
                this.particles = [];
                for (let i = 0; i < this.numParticles; i++) {
                    this.particles.push({ x: Math.random() * this.canvas.width, y: Math.random() * this.canvas.height, radius: Math.random() * 1.2 + 0.2, vx: (Math.random() - 0.5) * 0.15, vy: (Math.random() - 0.5) * 0.15, alpha: Math.random() * 0.5 + 0.1, pulseDir: Math.random() > 0.5 ? 1 : -1 });
                }
            }
            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.alpha += 0.005 * p.pulseDir;
                    if (p.alpha > 0.7) { p.alpha = 0.7; p.pulseDir = -1; } if (p.alpha < 0.1) { p.alpha = 0.1; p.pulseDir = 1; }
                    if (p.x < 0) p.x = this.canvas.width; if (p.x > this.canvas.width) p.x = 0;
                    if (p.y < 0) p.y = this.canvas.height; if (p.y > this.canvas.height) p.y = 0;
                    this.ctx.beginPath(); this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); this.ctx.fillStyle = `rgba(216, 180, 254, ${p.alpha})`; this.ctx.fill();
                });
                requestAnimationFrame(() => this.animate());
            }
        }

        class BurstParticles {
            constructor() { this.canvas = document.getElementById('burst-canvas'); this.ctx = this.canvas.getContext('2d'); this.particles = []; this.animating = false; }
            resize(w, h) { this.canvas.width = w; this.canvas.height = h; }
            trigger(x, y) {
                this.particles = [];
                for(let i=0; i<30; i++){
                    const angle = (Math.random() * Math.PI) + Math.PI; const speed = Math.random() * 3 + 1;
                    this.particles.push({ x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, radius: Math.random() * 2 + 1, alpha: 1, life: Math.random() * 0.02 + 0.01 });
                }
                if(!this.animating){ this.animating = true; this.animate(); }
            }
            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height); let alive = false;
                this.particles.forEach(p => {
                    if (p.alpha > 0) {
                        alive = true; p.x += p.vx; p.y += p.vy; p.alpha -= p.life;
                        this.ctx.beginPath(); this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); this.ctx.fillStyle = `rgba(216, 180, 254, ${Math.max(0, p.alpha)})`; this.ctx.fill();
                        this.ctx.shadowBlur = 5; this.ctx.shadowColor = '#d8b4fe';
                    }
                });
                if (alive) { requestAnimationFrame(() => this.animate()); } else { this.animating = false; this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height); }
            }
        }

        const StorageManager = {
            KEY: 'cosmic_wheel_recent',
            get: function() { try { return JSON.parse(localStorage.getItem(this.KEY)) || []; } catch(e) { return []; } },
            add: function(title) { let list = this.get(); if (list[0] !== title) { list.unshift(title); if (list.length > 5) list = list.slice(0, 5); localStorage.setItem(this.KEY, JSON.stringify(list)); } },
            render: function(containerId) {
                const container = document.getElementById(containerId); const list = this.get(); container.innerHTML = '';
                if (list.length === 0) { container.innerHTML = '<span class="text-xs text-purple-500/50">Hələ heç nə seçilməyib</span>'; return; }
                list.slice(0, 3).forEach((title, idx) => {
                    const span = document.createElement('span'); span.className = `history-item text-[11px] px-2 py-1 bg-purple-900/30 border border-purple-500/20 rounded-full text-purple-300`;
                    span.style.animationDelay = `${idx * 0.1}s`; span.textContent = title; container.appendChild(span);
                });
            }
        };

        class TodayChoiceApp {
            constructor() {
                this.items = QUESTIONS; 
                this.numSegments = this.items.length; 
                this.isSpinning = false; this.currentRotation = 0; this.lastSelectedIndex = -1; this.highlightedIndex = -1;
                this.colors = ['#1a0b2e', '#230f3f', '#120524']; 
                this.wheelCanvas = document.getElementById('wheel-canvas'); this.ctx = this.wheelCanvas.getContext('2d', { alpha: true });
                this.spinBtn = document.getElementById('spin-btn');
                this.resultOverlay = document.getElementById('result-overlay'); this.resultCard = document.getElementById('result-card');
                this.resultTitle = document.getElementById('result-title');
                this.btnCloseResult = document.getElementById('btn-close-result'); this.btnSpinAgain = document.getElementById('btn-spin-again');
                this.burstSystem = new BurstParticles();
                this.init();
            }
            init() {
                new BackgroundParticles(); StorageManager.render('history-list');
                this.setupCanvas(); window.addEventListener('resize', () => { this.setupCanvas(); this.drawWheel(); }); this.drawWheel();
                this.bindEvents();
            }
            setupCanvas() {
                const size = 1200; this.wheelCanvas.width = size; this.wheelCanvas.height = size;
                this.centerX = size / 2; this.centerY = size / 2; this.radius = size / 2 - 20;
                const rect = this.wheelCanvas.getBoundingClientRect(); this.burstSystem.resize(rect.width, rect.height);
            }
            drawWheel() {
                const { ctx, centerX, centerY, radius, numSegments, items, colors } = this;
                ctx.clearRect(0, 0, this.wheelCanvas.width, this.wheelCanvas.height); const arc = (Math.PI * 2) / numSegments; ctx.lineWidth = 1;
                for (let i = 0; i < numSegments; i++) {
                    const angle = i * arc - (Math.PI / 2); 
                    ctx.beginPath(); ctx.moveTo(centerX, centerY); ctx.arc(centerX, centerY, radius, angle, angle + arc); ctx.lineTo(centerX, centerY);
                    if (this.highlightedIndex === i) { ctx.fillStyle = '#4c1d95'; ctx.shadowBlur = 20; ctx.shadowColor = '#d8b4fe'; } else { ctx.fillStyle = colors[i % colors.length]; ctx.shadowBlur = 0; }
                    ctx.fill(); ctx.strokeStyle = 'rgba(138, 43, 226, 0.2)'; ctx.stroke(); ctx.shadowBlur = 0; 
                    ctx.save(); ctx.translate(centerX, centerY); ctx.rotate(angle + arc / 2); ctx.textAlign = "right"; ctx.textBaseline = "middle";
                    const text = "SUAL " + items[i].id;
                    ctx.fillStyle = (this.highlightedIndex === i) ? "#ffffff" : "rgba(233, 213, 255, 0.85)"; ctx.font = `600 11px 'Inter', sans-serif`;
                    ctx.fillText(text, radius - 15, 0, radius - 150); 
                    ctx.restore();
                }
            }
            bindEvents() {
                this.spinBtn.addEventListener('click', () => this.spin());
                this.btnSpinAgain.addEventListener('click', () => { this.closeResult(); setTimeout(() => this.spin(), 300); });
                this.btnCloseResult.addEventListener('click', () => this.closeResult());
                this.wheelCanvas.addEventListener('transitionend', () => this.onSpinComplete());
            }
            spin() {
                if (this.isSpinning) return; this.isSpinning = true; this.spinBtn.disabled = true; this.highlightedIndex = -1; this.drawWheel(); 
                
                let historyTitles = StorageManager.get();
                let historyIds = historyTitles.map(t => parseInt(t.replace('Sual #', '')));
                let availableIndices = this.items.map((_, i) => i).filter(i => !historyIds.includes(this.items[i].id));
                
                if (availableIndices.length === 0) availableIndices = this.items.map((_, i) => i).filter(i => i !== this.lastSelectedIndex);
                if (availableIndices.length === 0) availableIndices = [0];
                
                const targetIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)]; 
                this.lastSelectedIndex = targetIndex; this.currentSelectedActivity = this.items[targetIndex];
                const segmentAngle = 360 / this.numSegments; const targetAngleRel = 360 - (targetIndex * segmentAngle);
                const currentMod = this.currentRotation % 360; let rotateBy = targetAngleRel - currentMod;
                const extraSpins = (Math.floor(Math.random() * 4) + 5) * 360; this.currentRotation += (extraSpins + rotateBy);
                const duration = (Math.random() * 3 + 4).toFixed(2);
                this.wheelCanvas.style.transition = `transform ${duration}s cubic-bezier(0.15, 0.95, 0.25, 1)`; this.wheelCanvas.style.transform = `rotate(${this.currentRotation}deg)`;
            }
            onSpinComplete() {
                if (!this.isSpinning) return; this.isSpinning = false; this.highlightedIndex = this.lastSelectedIndex; this.drawWheel();
                const rect = document.getElementById('burst-canvas').getBoundingClientRect(); this.burstSystem.trigger(rect.width / 2, 20);
                StorageManager.add('Sual #' + this.currentSelectedActivity.id); StorageManager.render('history-list');
                setTimeout(() => this.showResult(this.currentSelectedActivity), 600);
            }
            showResult(activity) {
                this.resultTitle.textContent = activity.title;
                this.resultOverlay.classList.remove('hidden'); this.resultOverlay.classList.add('flex');
                this.resultCard.classList.remove('modal-enter'); void this.resultCard.offsetWidth; this.resultCard.classList.add('modal-enter');
            }
            closeResult() { this.resultOverlay.classList.add('hidden'); this.resultOverlay.classList.remove('flex'); this.spinBtn.disabled = false; }
        }
        document.addEventListener('DOMContentLoaded', () => { new TodayChoiceApp(); });
    </script>

    <!-- Kəsilməz Qlobal Musiqi Sistemi -->
    <script>
        window.GlobalAudio = (function() {
            if(window.__globalAudio) return window.__globalAudio;
            const audio = new Audio();
            audio.loop = true;
            const state = JSON.parse(localStorage.getItem('cosmic_audio_state')) || { src: '', time: 0, isPlaying: false };
            if (state.src) {
                audio.src = state.src;
                audio.currentTime = state.time;
                if (state.isPlaying) {
                    audio.play().catch(e => {
                        const resume = () => { audio.play(); document.removeEventListener('click', resume); };
                        document.addEventListener('click', resume, {once: true});
                        document.addEventListener('touchstart', resume, {once: true});
                    });
                }
            }
            setInterval(() => {
                if(!audio.paused && audio.src) {
                    localStorage.setItem('cosmic_audio_state', JSON.stringify({src: audio.src, time: audio.currentTime, isPlaying: true}));
                }
            }, 1000);
            window.addEventListener('beforeunload', () => {
                if(audio.src) localStorage.setItem('cosmic_audio_state', JSON.stringify({src: audio.src, time: audio.currentTime, isPlaying: !audio.paused}));
            });
            window.addEventListener('storage', (e) => {
                if(e.key === 'cosmic_audio_state' && e.newValue) {
                    const newState = JSON.parse(e.newValue);
                    if(!newState.isPlaying && !audio.paused) audio.pause();
                    if(newState.isPlaying && audio.paused && audio.src.endsWith(newState.src)) audio.play().catch(()=>{});
                }
            });
            window.__globalAudio = audio;
            return audio;
        })();
    </script>
