<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>100 Sual | Cosmic Decision Wheel</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cosmic-bg: #070311;
            --purple-glow: rgba(138, 43, 226, 0.5);
            --lavender: #d8b4fe;
            --dark-glass: rgba(20, 10, 40, 0.65);
            --z-bg: 0;
            --z-particles: 10;
            --z-wheel: 20;
            --z-ui: 30;
        }

        body {
            background-color: var(--cosmic-bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .cinzel { font-family: 'Cinzel', serif; }

        #particle-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: var(--z-bg); background: radial-gradient(circle at center, #0f051c 0%, #05010a 100%); pointer-events: none; }
        #particle-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: var(--z-particles); pointer-events: none; }
        #burst-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 25; }

        .glass-panel { background: var(--dark-glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(168, 85, 247, 0.3); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), 0 0 20px rgba(138, 43, 226, 0.15); }
        .text-glow { text-shadow: 0 0 15px rgba(216, 180, 254, 0.7); }

        .wheel-wrapper { position: relative; width: 100%; max-width: 550px; aspect-ratio: 1 / 1; margin: 0 auto; z-index: var(--z-wheel); display: flex; align-items: center; justify-content: center; }
        .wheel-container { position: relative; width: 90%; height: 90%; border-radius: 50%; box-shadow: 0 0 60px rgba(138, 43, 226, 0.3), inset 0 0 40px rgba(0, 0, 0, 0.9); border: 5px solid rgba(138, 43, 226, 0.5); background: #0d041a; }
        #wheel-canvas { width: 100%; height: 100%; border-radius: 50%; display: block; }
        .wheel-center-cap { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 12%; height: 12%; background: radial-gradient(circle, #3b176b 0%, #110524 100%); border-radius: 50%; border: 2px solid rgba(216, 180, 254, 0.7); box-shadow: 0 0 20px rgba(138, 43, 226, 0.9); z-index: 10; }

        .wheel-pointer { position: absolute; top: -25px; left: 50%; transform: translateX(-50%); width: 36px; height: 45px; background: linear-gradient(to bottom, #f3e8ff, #9333ea); clip-path: polygon(50% 100%, 0 0, 100% 0); z-index: 20; filter: drop-shadow(0 0 12px rgba(216, 180, 254, 1)); animation: float-pointer 2s ease-in-out infinite; }
        @keyframes float-pointer { 0%, 100% { transform: translateX(-50%) translateY(0); filter: drop-shadow(0 0 10px rgba(216, 180, 254, 0.8)); } 50% { transform: translateX(-50%) translateY(-3px); filter: drop-shadow(0 0 18px rgba(216, 180, 254, 1)); } }

        .btn-spin { background: linear-gradient(135deg, rgba(107, 33, 168, 0.8), rgba(59, 7, 100, 0.9)); border: 1px solid rgba(216, 180, 254, 0.5); box-shadow: 0 4px 20px rgba(138, 43, 226, 0.4); transition: all 0.3s ease; position: relative; overflow: hidden; }
        .btn-spin::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: all 0.5s ease; }
        .btn-spin:hover:not(:disabled) { transform: translateY(-2px) scale(1.02); box-shadow: 0 6px 25px rgba(138, 43, 226, 0.7); border-color: rgba(216, 180, 254, 0.9); }
        .btn-spin:hover:not(:disabled)::before { left: 100%; }
        .btn-spin:active:not(:disabled) { transform: translateY(1px); }
        .btn-spin:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(0.5); box-shadow: none; }

        #result-overlay { z-index: var(--z-ui); }
        .modal-enter { animation: modalFadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes modalFadeInScale { 0% { opacity: 0; transform: scale(0.8) translateY(30px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }

        .btn-secondary { background: rgba(30, 10, 60, 0.6); border: 1px solid rgba(138, 43, 226, 0.4); transition: all 0.3s ease; }
        .btn-secondary:hover { background: rgba(50, 15, 90, 0.8); border-color: rgba(216, 180, 254, 0.6); }

        .history-item { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start relative">

    <script>
        const QUESTIONS = 

[
  { "id": 1, "title": "Bir insanın həyatına yavaş-yavaş daxil olub gündəlik vərdişlərinin bir hissəsinə çevrildiyini ilk nədən anlayırsan?" },
  { "id": 2, "title": "Gələcəkdə yaşayacağın evin necə görünməsindən çox, o evdə hansı hissləri yaşamaq istəyərdin?" },
  { "id": 3, "title": "Birini tanımağa başlayanda hansı məqamda onun sadəcə maraqlı bir insan olmadığını, həyatında xüsusi yer tutmağa başladığını anlayırsan?" },
  { "id": 4, "title": "Təsəvvür et ki, beş il sonrakı həyatından adi bir günə baxmaq imkanın var. O günün hansı detalını görmək sənə ən çox maraqlı gələrdi?" },
  { "id": 5, "title": "Səncə, insan kiməsə alışdığını daha çox onun yanında olanda hiss edir, yoxsa yanında olmayanda?" },
  { "id": 6, "title": "Əgər gələcəkdə həyatını biri ilə bölüşsən, onunla mütləq yaşamaq istədiyin üç kiçik, amma sənin üçün mənalı şey nə olardı?" },
  { "id": 7, "title": "Biri ilə danışandan sonra özünü səbəbsiz yerə yaxşı hiss edirsənsə, bunun arxasında hansı duyğunun dayandığını düşünürsən?" },
  { "id": 8, "title": "Gələcəkdə bir insanla birlikdə yaşamağa qərar versən, ən çox hansı gündəlik vərdişinizin yaranmasını istəyərdin?" },
  { "id": 9, "title": "Səncə, iki insan arasında romantik hisslərin yaranması üçün güclü bir hadisə lazımdır, yoxsa yüzlərlə kiçik anın toplanması kifayətdir?" },
  { "id": 10, "title": "Həyatında biri ilə bağlı gələcək planları qurmağa başladığını necə anlayarsan, xüsusən də bunu özünə hələ etiraf etməmisənsə?" },
  { "id": 11, "title": "Bir insanın sənə verdiyi ən gözəl hiss hansı olardı: yanında özün olmaq, onun üçün xüsusi olmaq, yoxsa onunla hər şeyi mümkün görmək?" },
  { "id": 12, "title": "Təsəvvür et ki, gələcəkdə sevdiyin insanla yağışlı bir bazar günü evdəsən. O günün səhərdən axşama qədər necə keçməsini istəyərdin?" },
  { "id": 13, "title": "Səncə, iki insan bir-birinə yaxınlaşdıqca aralarındakı həyəcan azalmalıdır, yoxsa başqa bir formaya keçməlidir?" },
  { "id": 14, "title": "Həyatında hansı insanın sənə aid ən kiçik detalları belə yadda saxlaması sənin üçün böyük məna daşıyardı?" },
  { "id": 15, "title": "Əgər gələcəkdə quracağın həyatın yalnız bir xüsusiyyətini indidən seçə bilsəydin, onun sakit, macəralı, romantik, yoxsa daim yeniliklərlə dolu olmasını istəyərdin?" },
  { "id": 16, "title": "Birinin adını telefonunda görəndə istəmədən gülümsəmək sənin üçün nə ifadə edir?" },
  { "id": 17, "title": "İllər sonra həyatındakı xüsusi bir insanla ilk tanış olduğunuz gün haqqında danışanda hansı detalı unutmaq istəməzdin?" },
  { "id": 18, "title": "Səncə, insan gələcək planlarında kiməsə yer ayırdığını ilk dəfə hansı kiçik düşüncəsindən fərq edir?" },
  { "id": 19, "title": "Biri ilə saatlarla söhbət etmək daha romantikdir, yoxsa onun yanında heç nə danışmadan da özünü rahat hiss etmək?" },
  { "id": 20, "title": "Əgər gələcəkdə həyatını paylaşacağın insanla hər il təkrarlayacağınız özəl bir ənənə yaratsaydınız, bu nə olardı?" },
  { "id": 21, "title": "Səncə, kimisə darıxmaqla onunla danışmaq istəmək arasında hansı fərq var?" },
  { "id": 22, "title": "Gələcəkdə başqa ölkədə yaşamaq imkanın olsa, bu qərarı verərkən həyatındakı xüsusi bir insanın fikri sənin üçün nə qədər önəmli olardı?" },
  { "id": 23, "title": "Bir insanın həyatına girməsi sənin gələcəklə bağlı fikirlərini dəyişə bilərmi? Hansı mövzularda?" },
  { "id": 24, "title": "Səncə, bir münasibətdə ən romantik şey böyük etiraflar etməkdir, yoxsa hər gün eyni insanı yenidən seçmək?" },
  { "id": 25, "title": "Heç gələcəkdə yaşamaq istədiyin bir anı xəyalında o qədər canlandırmısan ki, sanki həmin an üçün darıxmısan?" },
  { "id": 26, "title": "Əgər səni çox yaxşı tanıyan biri sənə heç soruşmadan bir hədiyyə hazırlasa, onun hansı detalı bilməsi səni ən çox təsirləndirərdi?" },
  { "id": 27, "title": "Bir insanın yanında vaxtın necə keçdiyini hiss etməmək səncə sadəcə yaxşı ünsiyyətdir, yoxsa daha dərin bir uyğunluğun əlaməti?" },
  { "id": 28, "title": "Gələcəkdə ailə qurmaq haqqında düşünəndə ağlına ilk olaraq məsuliyyət, rahatlıq, sevgi, yoxsa birlikdə böyümək gəlir?" },
  { "id": 29, "title": "Səncə, bir insan başqa birinin həyatında öz yerinin olduğunu necə hiss edə bilər, bunu açıq şəkildə eşitmədən?" },
  { "id": 30, "title": "İllər sonra birlikdə olacağın insanla ilk günlərinizə baxanda hansı davranışınızın heç dəyişməməsini istəyərdin?" },
  { "id": 31, "title": "Əgər kiminləsə bütün gələcəyini planlaşdırmaq imkanın olsa, ilk olaraq hansı planı qurmaqdan başlamaq istəyərdin?" },
  { "id": 32, "title": "Birinin sənin üçün xüsusi olduğunu başa düşmək üçün onu itirmək ehtimalını düşünmək lazımdırmı, yoxsa bunu daha gözəl bir yolla anlamaq mümkündür?" },
  { "id": 33, "title": "Gələcəkdə bir gün işdən yorğun qayıdanda evdə səni qarşılayan insandan ilk olaraq hansı davranışı gözləyərdin?" },
  { "id": 34, "title": "Səncə, iki insanın xaraktercə uyğun olması daha vacibdir, yoxsa həyatdan eyni şeyləri istəməsi?" },
  { "id": 35, "title": "Bir insanın sənə qarşı hisslərinin ciddiləşdiyini sözlərinə baxmadan hansı davranışından anlaya bilərsən?" },
  { "id": 36, "title": "Əgər gələcəkdə bütün planların dəyişsə, amma yanında sənə güvən verən biri olsa, bu dəyişikliklərə daha rahat yanaşardın?" },
  { "id": 37, "title": "Səncə, birlikdə qocalmaq fikrini romantik edən əsas şey uzun illərdir, yoxsa o illər ərzində yaşanan kiçik hadisələr?" },
  { "id": 38, "title": "Bir insanı tanıdıqca onunla gələcəyi təsəvvür etməyin asanlaşması sənin üçün nə demək olardı?" },
  { "id": 39, "title": "Gələcəkdə yanında olacaq insanın sənin hansı arzusunu hamıdan yaxşı bilməsini istəyərdin?" },
  { "id": 40, "title": "Səncə, sevgi insanın gələcək arzularını dəyişdirir, yoxsa həmin arzuları paylaşmaq istədiyi insanı dəyişdirir?" },
  { "id": 41, "title": "İkimiz bir gün heç bir plan qurmadan səhər yola çıxsaq, o günün necə keçməsini istəyərdin?" },
  { "id": 42, "title": "Bir insanın sənə ayırdığı vaxtla sənin üçün etdiyi fədakarlıq arasında seçim etməli olsan, hansına daha çox dəyər verərdin?" },
  { "id": 43, "title": "Gələcəkdə bir insanla özünüzə aid kiçik bir dünya qursanız, o dünyada mütləq olmasını istədiyin üç şey nə olardı?" },
  { "id": 44, "title": "Səncə, iki insan arasında yaxınlıq hansı anda başlayır: bir-birini bəyəndikləri vaxt, yoxsa artıq bir-birlərinin gününə təsir etməyə başladıqları vaxt?" },
  { "id": 45, "title": "Gələcəkdə karyera və şəxsi həyatın arasında seçim etmək məcburiyyətində qalsan, hər ikisini qorumaq üçün necə bir yol axtarardın?" },
  { "id": 46, "title": "Sənin üçün daha mənalı olan nədir: birinin səni çox gözəl sözlərlə təsvir etməsi, yoxsa sənin belə fərq etmədiyin xüsusiyyətini bilməsi?" },
  { "id": 47, "title": "Təsəvvür et ki, on il sonrakı özün sənə yalnız bir şəkil göndərə bilər. Həmin şəkildə nə görmək istəyərdin?" },
  { "id": 48, "title": "Bir münasibətdə insanın özünə aid dünyası qalmalıdır, yoxsa zamanla iki insanın dünyası tamamilə birləşməlidir?" },
  { "id": 49, "title": "Səncə, həqiqi uyğunluq iki insanın eyni şeyləri sevməsidir, yoxsa fərqli şeyləri birlikdə sevməyi öyrənməsidir?" },
  { "id": 50, "title": "Gələcəkdə həyatını paylaşdığın insanın sənin hansı dəyişməyən xüsusiyyətinə illər sonra da heyran qalmasını istəyərdin?" },
  { "id": 51, "title": "Bir insan sənə gözləmədiyin qədər yaxınlaşanda daha çox həyəcanlanırsan, yoxsa bu yaxınlığın məsuliyyətini düşünürsən?" },
  { "id": 52, "title": "Əgər gələcəkdə birlikdə olacağın insanla bir kitab yazsaydınız, onun hansı dövrünüzdən bəhs etməsini istəyərdin?" },
  { "id": 53, "title": "Səncə, birinin sənin üçün xüsusi olmasının ən gözəl sübutu onu hamıdan fərqli görməyindir, yoxsa yanında özünü hamıdan fərqli hiss etməyin?" },
  { "id": 54, "title": "Bir gün çox xoşbəxt bir xəbər alsan, onu ilk danışmaq istədiyin insanı necə seçirsən?" },
  { "id": 55, "title": "Gələcəkdə biri ilə uzun illər birlikdə olsan, münasibətinizin hansı tərəfinin heç vaxt adiləşməsini istəməzdin?" },
  { "id": 56, "title": "İki insan arasında hər şey çox rahat və təbii alınırsa, səncə, bu təsadüfdür, yoxsa nadir rast gəlinən uyğunluq?" },
  { "id": 57, "title": "Əgər gələcəkdə sevdiyin insanla birlikdə yeni bir şəhərə köçsən, ilk həftənizi necə keçirməyi xəyal edərdin?" },
  { "id": 58, "title": "Heç birinin hisslərini açıq demədiyi iki insanın bir-birini bəyəndiyini səncə ətrafdakılar hansı davranışlardan anlaya bilərlər?" },
  { "id": 59, "title": "Səncə, biri sənin planlarında özün də fərq etmədən yer almağa başlayıbsa, bu nəyi göstərir?" },
  { "id": 60, "title": "Gələcəkdə bir insanla hər axşam yatmazdan əvvəl danışmaq vərdişin olsa, bir müddət sonra həmin söhbətlər sənin üçün nə ifadə edərdi?" },
  { "id": 61, "title": "Birinə qarşı marağın olduğunu özünə etiraf etmək sənin üçün asandır, yoxsa əvvəlcə onun nə hiss etdiyini anlamağa çalışırsan?" },
  { "id": 62, "title": "Səncə, həyatında xüsusi yeri olan bir insanın gələcəyi haqqında düşünəndə öz gələcəyini də onunla əlaqələndirmək təbiidir?" },
  { "id": 63, "title": "Bir gün hər şey istədiyin kimi getsə, amma həmin uğuru bölüşmək istədiyin insan yanında olmasa, o gün sənin üçün nəsə əskik qalarmı?" },
  { "id": 64, "title": "Əgər gələcəkdə bir insanla uzun bir səfərə çıxsan, yol boyu onun hansı xarakter xüsusiyyətini daha yaxşı tanımaq istəyərdin?" },
  { "id": 65, "title": "Səncə, bir insanın sənə hiss etdirdiyi rahatlıq zaman keçdikcə romantik duyğuya çevrilə bilər?" },
  { "id": 66, "title": "Gələcəkdə birlikdə olacağın insanla ilk böyük uğurunuzu qeyd etmək üçün necə bir gün təşkil edərdin?" },
  { "id": 67, "title": "Bir insanın danışıq tərzinə, zarafatlarına və gündəlik vərdişlərinə alışmaq sənin üçün nə qədər emosional məna daşıyır?" },
  { "id": 68, "title": "Təsəvvür et ki, həyatında hər şey çox sürətlə dəyişir. Yanında hansı xarakterdə birinin olması sənə ən çox rahatlıq verərdi?" },
  { "id": 69, "title": "Səncə, bir insanla bağlı ən gözəl xəyallar planlaşdırdıqlarındır, yoxsa heç gözləmədən ağlına gələn kiçik gələcək səhnələri?" },
  { "id": 70, "title": "Əgər bir gün ikimiz eyni evin içində öz işlərimizlə məşğul olsaq, hərəmiz fərqli otaqda olsaq belə, bu sənə necə bir hiss verərdi?" },
  { "id": 71, "title": "Bir insanın səni tanıdıqca daha çox bəyənməsi üçün sənin haqqında hansı həqiqəti kəşf etməsi lazımdır?" },
  { "id": 72, "title": "Səncə, sevgi əvvəlcə bir insanı həyatına əlavə etməkdir, yoxsa yavaş-yavaş həyatının ayrılmaz hissəsinə çevirmək?" },
  { "id": 73, "title": "Gələcəkdə özünə bir söz verməli olsan, şəxsi münasibətlərində heç vaxt hansı səhvi təkrarlamayacağına söz verərdin?" },
  { "id": 74, "title": "Əgər bütün həyatın boyunca yalnız bir insanla birlikdə dünyanın müxtəlif yerlərini gəzə bilsəydin, onun hansı xüsusiyyətləri olmalı idi?" },
  { "id": 75, "title": "Səncə, birinin sənin adi bir gününü gözəlləşdirməsi onunla bağlı hisslərinin nə qədər dəyişməsinə səbəb ola bilər?" },
  { "id": 76, "title": "İkimiz birlikdə hansısa böyük bir məqsəd qoysaq, səncə, hansımız daha çox xəyal qurar, hansımız onu həyata keçirmək üçün çalışardı?" },
  { "id": 77, "title": "Sənin üçün bir insanın yanında ağlaya bilmək daha böyük güvən göstəricisidir, yoxsa onun yanında uşaq kimi sevinə bilmək?" },
  { "id": 78, "title": "Gələcəkdə həyatında bir insanın daim yanında olacağını bilsən, bu sənə daha çox azadlıq verər, yoxsa məsuliyyət hissi?" },

    <div id="particle-bg"></div>
    <canvas id="particle-canvas"></canvas>

    <div class="w-full max-w-4xl mx-auto px-4 pt-16 pb-8 flex flex-col relative z-[30] min-h-screen">
        <header class="text-center w-full mb-8 mt-4">

        </header>

        <main class="w-full flex-grow flex flex-col items-center justify-center gap-10">

                <div class="wheel-pointer"></div>
                <div class="wheel-container">
                    <canvas id="wheel-canvas"></canvas>

                    <div class="wheel-center-cap"></div>

            </div>

            <div class="flex flex-col items-center gap-6 w-full max-w-md">
                <button id="spin-btn" class="btn-spin cinzel font-bold text-xl md:text-2xl text-white py-4 px-12 rounded-full tracking-widest w-full sm:w-auto">ÇARXI FIRLAT</button>
                <div class="w-full text-center mt-4">
                    <h3 class="text-xs text-purple-400/70 uppercase tracking-widest mb-3">Son Seçimlər</h3>

    <div id="result-overlay" class="fixed inset-0 bg-black/85 backdrop-blur-md hidden flex-col items-center justify-center p-4">
        <div id="result-card" class="glass-panel p-8 md:p-10 rounded-2xl max-w-lg w-full text-center relative border border-purple-400/50 shadow-2xl">
            <div class="absolute -top-12 left-1/2 -translate-x-1/2 w-24 h-24 bg-purple-600/40 rounded-full blur-3xl"></div>
            <p class="text-purple-300 text-xs md:text-sm font-semibold tracking-widest uppercase mb-4">BUGÜNÜN SUALI</p>
            <h2 id="result-title" class="text-xl md:text-3xl font-bold text-white mb-10 cinzel text-glow leading-relaxed">Question Title</h2>
            <div class="flex flex-col sm:flex-row items-center justify-center gap-4 w-full">
                <button id="btn-spin-again" class="btn-spin text-white px-8 py-3 rounded-full font-medium tracking-wide w-full sm:w-auto text-sm">YENİDƏN FIRLAT</button>
                <button id="btn-close-result" class="btn-secondary text-purple-200 px-8 py-3 rounded-full font-medium tracking-wide w-full sm:w-auto text-sm">BAĞLA</button>
            </div>
        </div>

    <script>
        class BackgroundParticles {
            constructor() {
                this.canvas = document.getElementById('particle-canvas'); this.ctx = this.canvas.getContext('2d');
                this.particles = []; this.numParticles = window.innerWidth < 768 ? 60 : 150;
                this.resize(); window.addEventListener('resize', () => this.resize());
                this.initParticles(); this.animate();
            }
            resize() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; }
            initParticles() {
                this.particles = [];
                for (let i = 0; i < this.numParticles; i++) {
                    this.particles.push({ x: Math.random() * this.canvas.width, y: Math.random() * this.canvas.height, radius: Math.random() * 1.2 + 0.2, vx: (Math.random() - 0.5) * 0.15, vy: (Math.random() - 0.5) * 0.15, alpha: Math.random() * 0.5 + 0.1, pulseDir: Math.random() > 0.5 ? 1 : -1 });
                }
            }
            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.alpha += 0.005 * p.pulseDir;
                    if (p.alpha > 0.7) { p.alpha = 0.7; p.pulseDir = -1; } if (p.alpha < 0.1) { p.alpha = 0.1; p.pulseDir = 1; }
                    if (p.x < 0) p.x = this.canvas.width; if (p.x > this.canvas.width) p.x = 0;
                    if (p.y < 0) p.y = this.canvas.height; if (p.y > this.canvas.height) p.y = 0;
                    this.ctx.beginPath(); this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); this.ctx.fillStyle = `rgba(216, 180, 254, ${p.alpha})`; this.ctx.fill();
                });
                requestAnimationFrame(() => this.animate());
            }
        }

        class BurstParticles {
            constructor() { this.canvas = document.getElementById('burst-canvas'); this.ctx = this.canvas.getContext('2d'); this.particles = []; this.animating = false; }
            resize(w, h) { this.canvas.width = w; this.canvas.height = h; }
            trigger(x, y) {
                this.particles = [];
                for(let i=0; i<30; i++){
                    const angle = (Math.random() * Math.PI) + Math.PI; const speed = Math.random() * 3 + 1;
                    this.particles.push({ x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, radius: Math.random() * 2 + 1, alpha: 1, life: Math.random() * 0.02 + 0.01 });
                }
                if(!this.animating){ this.animating = true; this.animate(); }
            }
            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height); let alive = false;
                this.particles.forEach(p => {
                    if (p.alpha > 0) {
                        alive = true; p.x += p.vx; p.y += p.vy; p.alpha -= p.life;
                        this.ctx.beginPath(); this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); this.ctx.fillStyle = `rgba(216, 180, 254, ${Math.max(0, p.alpha)})`; this.ctx.fill();
                        this.ctx.shadowBlur = 5; this.ctx.shadowColor = '#d8b4fe';
                    }
                });
                if (alive) { requestAnimationFrame(() => this.animate()); } else { this.animating = false; this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height); }
            }
        }

        const StorageManager = {
            KEY: 'cosmic_wheel_recent',
            get: function() { try { return JSON.parse(localStorage.getItem(this.KEY)) || []; } catch(e) { return []; } },
            add: function(title) { let list = this.get(); if (list[0] !== title) { list.unshift(title); if (list.length > 5) list = list.slice(0, 5); localStorage.setItem(this.KEY, JSON.stringify(list)); } },
            render: function(containerId) {
                const container = document.getElementById(containerId); const list = this.get(); container.innerHTML = '';
                if (list.length === 0) { container.innerHTML = '<span class="text-xs text-purple-500/50">Hələ heç nə seçilməyib</span>'; return; }
                list.slice(0, 3).forEach((title, idx) => {
                    const span = document.createElement('span'); span.className = `history-item text-[11px] px-2 py-1 bg-purple-900/30 border border-purple-500/20 rounded-full text-purple-300`;
                    span.style.animationDelay = `${idx * 0.1}s`; span.textContent = title; container.appendChild(span);
                });
            }
        };

        class TodayChoiceApp {
            constructor() {
                this.items = QUESTIONS; 
                this.numSegments = this.items.length; 
                this.isSpinning = false; this.currentRotation = 0; this.lastSelectedIndex = -1; this.highlightedIndex = -1;
                this.colors = ['#1a0b2e', '#230f3f', '#120524']; 
                this.wheelCanvas = document.getElementById('wheel-canvas'); this.ctx = this.wheelCanvas.getContext('2d', { alpha: true });
                this.spinBtn = document.getElementById('spin-btn');
                this.resultOverlay = document.getElementById('result-overlay'); this.resultCard = document.getElementById('result-card');
                this.resultTitle = document.getElementById('result-title');
                this.btnCloseResult = document.getElementById('btn-close-result'); this.btnSpinAgain = document.getElementById('btn-spin-again');
                this.burstSystem = new BurstParticles();
                this.init();
            }
            init() {
                new BackgroundParticles(); StorageManager.render('history-list');
                this.setupCanvas(); window.addEventListener('resize', () => { this.setupCanvas(); this.drawWheel(); }); this.drawWheel();
                this.bindEvents();
            }
            setupCanvas() {
                const size = 1200; this.wheelCanvas.width = size; this.wheelCanvas.height = size;
                this.centerX = size / 2; this.centerY = size / 2; this.radius = size / 2 - 20;
                const rect = this.wheelCanvas.getBoundingClientRect(); this.burstSystem.resize(rect.width, rect.height);
            }
            drawWheel() {
                const { ctx, centerX, centerY, radius, numSegments, items, colors } = this;
                ctx.clearRect(0, 0, this.wheelCanvas.width, this.wheelCanvas.height); const arc = (Math.PI * 2) / numSegments; ctx.lineWidth = 1;
                for (let i = 0; i < numSegments; i++) {
                    const angle = i * arc - (Math.PI / 2); 
                    ctx.beginPath(); ctx.moveTo(centerX, centerY); ctx.arc(centerX, centerY, radius, angle, angle + arc); ctx.lineTo(centerX, centerY);
                    if (this.highlightedIndex === i) { ctx.fillStyle = '#4c1d95'; ctx.shadowBlur = 20; ctx.shadowColor = '#d8b4fe'; } else { ctx.fillStyle = colors[i % colors.length]; ctx.shadowBlur = 0; }
                    ctx.fill(); ctx.strokeStyle = 'rgba(138, 43, 226, 0.2)'; ctx.stroke(); ctx.shadowBlur = 0; 
                    ctx.save(); ctx.translate(centerX, centerY); ctx.rotate(angle + arc / 2); ctx.textAlign = "right"; ctx.textBaseline = "middle";
                    const text = "SUAL " + items[i].id;
                    ctx.fillStyle = (this.highlightedIndex === i) ? "#ffffff" : "rgba(233, 213, 255, 0.85)"; ctx.font = `600 11px 'Inter', sans-serif`;
                    ctx.fillText(text, radius - 15, 0, radius - 150); 
                    ctx.restore();
                }
            }
            bindEvents() {
                this.spinBtn.addEventListener('click', () => this.spin());
                this.btnSpinAgain.addEventListener('click', () => { this.closeResult(); setTimeout(() => this.spin(), 300); });
                this.btnCloseResult.addEventListener('click', () => this.closeResult());
                this.wheelCanvas.addEventListener('transitionend', () => this.onSpinComplete());
            }
            spin() {
                if (this.isSpinning) return; this.isSpinning = true; this.spinBtn.disabled = true; this.highlightedIndex = -1; this.drawWheel(); 
                
                let historyTitles = StorageManager.get();
                let historyIds = historyTitles.map(t => parseInt(t.replace('Sual #', '')));
                let availableIndices = this.items.map((_, i) => i).filter(i => !historyIds.includes(this.items[i].id));
                
                if (availableIndices.length === 0) availableIndices = this.items.map((_, i) => i).filter(i => i !== this.lastSelectedIndex);
                if (availableIndices.length === 0) availableIndices = [0];
                
                const targetIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)]; 
                this.lastSelectedIndex = targetIndex; this.currentSelectedActivity = this.items[targetIndex];
                const segmentAngle = 360 / this.numSegments; const targetAngleRel = 360 - (targetIndex * segmentAngle);
                const currentMod = this.currentRotation % 360; let rotateBy = targetAngleRel - currentMod;
                const extraSpins = (Math.floor(Math.random() * 4) + 5) * 360; this.currentRotation += (extraSpins + rotateBy);
                const duration = (Math.random() * 3 + 4).toFixed(2);
                this.wheelCanvas.style.transition = `transform ${duration}s cubic-bezier(0.15, 0.95, 0.25, 1)`; this.wheelCanvas.style.transform = `rotate(${this.currentRotation}deg)`;
            }
            onSpinComplete() {
                if (!this.isSpinning) return; this.isSpinning = false; this.highlightedIndex = this.lastSelectedIndex; this.drawWheel();
                const rect = document.getElementById('burst-canvas').getBoundingClientRect(); this.burstSystem.trigger(rect.width / 2, 20);
                StorageManager.add('Sual #' + this.currentSelectedActivity.id); StorageManager.render('history-list');
                setTimeout(() => this.showResult(this.currentSelectedActivity), 600);
            }
            showResult(activity) {
                this.resultTitle.textContent = activity.title;
                this.resultOverlay.classList.remove('hidden'); this.resultOverlay.classList.add('flex');
                this.resultCard.classList.remove('modal-enter'); void this.resultCard.offsetWidth; this.resultCard.classList.add('modal-enter');
            }
            closeResult() { this.resultOverlay.classList.add('hidden'); this.resultOverlay.classList.remove('flex'); this.spinBtn.disabled = false; }
        }
        document.addEventListener('DOMContentLoaded', () => { new TodayChoiceApp(); });
    </script>

    <!-- Kəsilməz Qlobal Musiqi Sistemi -->
    <script>
        window.GlobalAudio = (function() {
            if(window.__globalAudio) return window.__globalAudio;
            const audio = new Audio();
            audio.loop = true;
            const state = JSON.parse(localStorage.getItem('cosmic_audio_state')) || { src: '', time: 0, isPlaying: false };
            if (state.src) {
                audio.src = state.src;
                audio.currentTime = state.time;
                if (state.isPlaying) {
                    audio.play().catch(e => {
                        const resume = () => { audio.play(); document.removeEventListener('click', resume); };
                        document.addEventListener('click', resume, {once: true});
                        document.addEventListener('touchstart', resume, {once: true});
                    });
                }
            }
            setInterval(() => {
                if(!audio.paused && audio.src) {
                    localStorage.setItem('cosmic_audio_state', JSON.stringify({src: audio.src, time: audio.currentTime, isPlaying: true}));
                }
            }, 1000);
            window.addEventListener('beforeunload', () => {
                if(audio.src) localStorage.setItem('cosmic_audio_state', JSON.stringify({src: audio.src, time: audio.currentTime, isPlaying: !audio.paused}));
            });
            window.addEventListener('storage', (e) => {
                if(e.key === 'cosmic_audio_state' && e.newValue) {
                    const newState = JSON.parse(e.newValue);
                    if(!newState.isPlaying && !audio.paused) audio.pause();
                    if(newState.isPlaying && audio.paused && audio.src.endsWith(newState.src)) audio.play().catch(()=>{});
                }
            });
            window.__globalAudio = audio;
            return audio;
        })();
    </script>
