<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>100 Sual | Cosmic Decision Wheel</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cosmic-bg: #070311;
            --purple-glow: rgba(138, 43, 226, 0.5);
            --lavender: #d8b4fe;
            --dark-glass: rgba(20, 10, 40, 0.65);
            --z-bg: 0;
            --z-particles: 10;
            --z-wheel: 20;
            --z-ui: 30;
        }

        body {
            background-color: var(--cosmic-bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .cinzel { font-family: 'Cinzel', serif; }

        #particle-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: var(--z-bg); background: radial-gradient(circle at center, #0f051c 0%, #05010a 100%); pointer-events: none; }
        #particle-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: var(--z-particles); pointer-events: none; }
        #burst-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 25; }

        .glass-panel { background: var(--dark-glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(168, 85, 247, 0.3); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), 0 0 20px rgba(138, 43, 226, 0.15); }
        .text-glow { text-shadow: 0 0 15px rgba(216, 180, 254, 0.7); }

        .wheel-wrapper { position: relative; width: 100%; max-width: 550px; aspect-ratio: 1 / 1; margin: 0 auto; z-index: var(--z-wheel); display: flex; align-items: center; justify-content: center; }
        .wheel-container { position: relative; width: 90%; height: 90%; border-radius: 50%; box-shadow: 0 0 60px rgba(138, 43, 226, 0.3), inset 0 0 40px rgba(0, 0, 0, 0.9); border: 5px solid rgba(138, 43, 226, 0.5); background: #0d041a; }
        #wheel-canvas { width: 100%; height: 100%; border-radius: 50%; display: block; }
        .wheel-center-cap { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 12%; height: 12%; background: radial-gradient(circle, #3b176b 0%, #110524 100%); border-radius: 50%; border: 2px solid rgba(216, 180, 254, 0.7); box-shadow: 0 0 20px rgba(138, 43, 226, 0.9); z-index: 10; }

        .wheel-pointer { position: absolute; top: -25px; left: 50%; transform: translateX(-50%); width: 36px; height: 45px; background: linear-gradient(to bottom, #f3e8ff, #9333ea); clip-path: polygon(50% 100%, 0 0, 100% 0); z-index: 20; filter: drop-shadow(0 0 12px rgba(216, 180, 254, 1)); animation: float-pointer 2s ease-in-out infinite; }
        @keyframes float-pointer { 0%, 100% { transform: translateX(-50%) translateY(0); filter: drop-shadow(0 0 10px rgba(216, 180, 254, 0.8)); } 50% { transform: translateX(-50%) translateY(-3px); filter: drop-shadow(0 0 18px rgba(216, 180, 254, 1)); } }

        .btn-spin { background: linear-gradient(135deg, rgba(107, 33, 168, 0.8), rgba(59, 7, 100, 0.9)); border: 1px solid rgba(216, 180, 254, 0.5); box-shadow: 0 4px 20px rgba(138, 43, 226, 0.4); transition: all 0.3s ease; position: relative; overflow: hidden; }
        .btn-spin::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: all 0.5s ease; }
        .btn-spin:hover:not(:disabled) { transform: translateY(-2px) scale(1.02); box-shadow: 0 6px 25px rgba(138, 43, 226, 0.7); border-color: rgba(216, 180, 254, 0.9); }
        .btn-spin:hover:not(:disabled)::before { left: 100%; }
        .btn-spin:active:not(:disabled) { transform: translateY(1px); }
        .btn-spin:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(0.5); box-shadow: none; }

        #result-overlay { z-index: var(--z-ui); }
        .modal-enter { animation: modalFadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes modalFadeInScale { 0% { opacity: 0; transform: scale(0.8) translateY(30px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }

        .btn-secondary { background: rgba(30, 10, 60, 0.6); border: 1px solid rgba(138, 43, 226, 0.4); transition: all 0.3s ease; }
        .btn-secondary:hover { background: rgba(50, 15, 90, 0.8); border-color: rgba(216, 180, 254, 0.6); }

        .history-item { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start relative">

    <script>
        const QUESTIONS = 



[
  { "id": 1, "title": "Təsəvvür et ki, ən yaxın dostun çox böyük bir səhv edib və bu səhv günahsız bir insanın həyatına təsir göstərəcək. Həqiqəti desən dostunu itirəcəksən, susanda isə günahsız insan zərər görəcək. Nə edərdin və niyə?" },
  { "id": 2, "title": "Bir gün mən səninlə çox ciddi mübahisə edirəm. Sonradan haqlı olduğumu anlayırsan, amma mən də mübahisə zamanı səni incidən sözlər demişəm. İlk addımı kim atmalıdır və sən necə davranardın?" },
  { "id": 3, "title": "Təsəvvür et ki, çox sevdiyin bir insan səndən elə bir xahiş edir ki, onu yerinə yetirsən öz prinsiplərindən birini pozacaqsan. Həmin insanı məyus etməmək üçün prinsipindən imtina edərdin?" },
  { "id": 4, "title": "Bir insan sənə qarşı çox yaxşı davranır, amma təsadüfən onun başqalarına qarşı qəddar olduğunu öyrənirsən. Sənə olan münasibətinə əsasən onu qiymətləndirərdin, yoxsa başqalarına davranışına görə?" },
  { "id": 5, "title": "Bir gün mən çox pis əhvalda oluram və heç bir izah vermədən səninlə danışmaq istəmirəm. Sən bunu şəxsi qəbul edərdin, məni danışmağa çalışdırardın, yoxsa özüm hazır olana qədər gözləyərdin?" },
  { "id": 6, "title": "Təsəvvür et ki, həyatının ən böyük fürsətini qazanmısan, amma həmin fürsəti qəbul etsən sevdiyin insanla uzun müddət ayrı qalacaqsan. Seçimini necə verərdin?" },
  { "id": 7, "title": "Sənə çox güvənən biri sənə sirrini danışıb. Bir müddət sonra həmin sirri bilməyin başqa bir insanı ciddi zərərdən qorumağa kömək edə bilər. Sirri saxlayardın, yoxsa açıqlayardın?" },
  { "id": 8, "title": "Təsəvvür et ki, mənim haqqımda çox pis bir söz-söhbət eşidirsən və bunu deyən insan da sənin güvəndiyin biridir. Əvvəlcə mənə inanardın, yoxsa həmin insanın dediklərinə? Həqiqəti necə araşdırardın?" },
  { "id": 9, "title": "Bir insan səni hamının içində alçaldır, amma sonradan tək olanda səmimi şəkildə üzr istəyir. Onu bağışlayardın, yoxsa insanların qarşısında da üzr istəməsini gözləyərdin?" },
  { "id": 10, "title": "Təsəvvür et ki, bir insan sənin ən həssas nöqtəni bilir və mübahisə zamanı bilərəkdən həmin mövzuya toxunur. Sonradan əsəbi olduğu üçün etdiyini deyir. Bu hadisədən sonra ona əvvəlki kimi güvənə bilərdin?" },
  { "id": 11, "title": "Bir gün mən sənin çoxdan planlaşdırdığın vacib bir günü unuduram, amma həmin vaxt öz həyatımda da çətin bir dövrdən keçirəm. Sən əvvəlcə incikliyini bildirərdin, yoxsa səbəbimi anlamağa çalışardın?" },
  { "id": 12, "title": "Təsəvvür et ki, iki dostun mübahisə edir. Biri sənin ən yaxın dostundur, digəri isə açıq şəkildə haqlıdır. Hamının qarşısında hansını müdafiə edərdin?" },
  { "id": 13, "title": "Çox çalışdığın bir məqsədə çatmısan, amma həmin uğurda səndən daha çox əziyyət çəkmiş bir insanın haqqının yeyildiyini anlayırsan. Uğurundan imtina edərdin, yoxsa vəziyyəti başqa cür düzəltməyə çalışardın?" },
  { "id": 14, "title": "Bir insan sənin haqqında yanlış fikir formalaşdırıb və bu fikir onun sənə daha çox hörmət etməsinə səbəb olub. Həqiqəti desən gözündəki dəyərin azalacaq. Yenə də həqiqəti deyərdin?" },
  { "id": 15, "title": "Təsəvvür et ki, mən sənə çox dəyər verdiyim bir planımı danışıram, amma sən həmin planın uğursuz olacağını düşünürsən. Məni ruhlandırardın, yoxsa xətrimə dəysə belə, açıq şəkildə fikrini deyərdin?" },
  { "id": 16, "title": "Bir insan sənə etdiyi pisliyin nəticəsində öz həyatında çox ağır vəziyyətə düşüb və indi səndən kömək istəyir. Keçmişi kənara qoyub kömək edərdin, yoxsa özünü qorumağı seçərdin?" },
  { "id": 17, "title": "Təsəvvür et ki, mən səninlə mübahisədən sonra üzr istəyirəm, amma sən mənim hələ də özümü haqlı hesab etdiyimi hiss edirsən. Üzrümü qəbul edərdin, yoxsa həqiqətən nə düşündüyümü bilməyə çalışardın?" },
  { "id": 18, "title": "Bir gün çox yaxın olduğun insanın sənə illərlə kiçik yalanlar danışdığını öyrənirsən. Bu yalanların heç biri sənə ciddi zərər verməyib. Yenə də ona olan güvənin dəyişərdi?" },
  { "id": 19, "title": "Əgər bir səhvini etiraf etməklə bütün insanların sənə olan hörmətini itirəcəyini, gizlətməklə isə heç kimin zərər görməyəcəyini bilsən, hansı yolu seçərdin?" },
  { "id": 20, "title": "Təsəvvür et ki, mən sənin fikrinlə razılaşmıram və bu mövzuda heç vaxt eyni düşünməyəcəyimiz aydın olur. Sən bunu münasibətimiz üçün problem hesab edərdin, yoxsa fərqli düşünməyimizi qəbul edə bilərdin?" },
  { "id": 21, "title": "Bir gün mən səninlə görüşmək üçün plan qurmuşam, amma son anda ən yaxın dostumun ciddi problem yaşadığını öyrənirəm və onun yanına getməli oluram. Sən özünü ikinci planda hiss edərdin, yoxsa qərarımı anlayardın?" },
  { "id": 22, "title": "Təsəvvür et ki, mənə çox yaxın bir qız dostum var və sən onun mənə qarşı hissləri olduğundan şübhələnirsən, amma heç bir sübutun yoxdur. Mənimlə necə danışardın və hansı sərhədləri vacib hesab edərdin?" },
  { "id": 23, "title": "Bir gün mən səndən narazı olduğum bir mövzunu açıqlayıram, amma sən həmin davranışın xarakterinin ayrılmaz hissəsi olduğunu düşünürsən. Münasibətimizi qorumaq üçün dəyişməyə çalışardın, yoxsa olduğun kimi qəbul edilməyi gözləyərdin?" },
  { "id": 24, "title": "Təsəvvür et ki, mənim ən böyük arzumla sənin ən böyük arzun bir-birinə ziddir və hər ikisini eyni zamanda həyata keçirmək mümkün deyil. Hansımız güzəştə getməlidir? Qərarı necə verərdik?" },
  { "id": 25, "title": "Bir gün mən sənin çox həssas olduğun bir mövzuda zarafat edirəm. Mənim üçün adi zarafatdır, amma səni həqiqətən incidir. Niyyətimə görə məni bağışlayardın, yoxsa nəticəsinə görə məsuliyyət daşımalı olduğumu düşünərdin?" },
  { "id": 26, "title": "Əgər mənim həyatımda əvvəllər çox önəmli olmuş bir insan yenidən ortaya çıxsa və sadəcə dost olmaq istəsə, bu vəziyyətdə sənin üçün hansı sərhədlər vacib olardı?" },
  { "id": 27, "title": "Təsəvvür et ki, mən çox ağır bir səhv etmişəm və bunu sənə dərhal özüm etiraf edirəm. Səni daha çox səhvin özü incidərdi, yoxsa mənim bunu edə biləcək biri olduğumu öyrənmək?" },
  { "id": 28, "title": "Bir gün mən sosial şəbəkədə paylaşdığın bir şəkli bəyənmədiyimi deyirəm, amma sən həmin şəkildə özünü çox gözəl hiss edirsən. Mənim narahatlığımı necə qarşılayardın və qərarını nəyə əsasən verərdin?" },
  { "id": 29, "title": "Təsəvvür et ki, ailəndən biri mənim haqqımda yanlış fikir formalaşdırıb və münasibətimizə qarşı çıxır. Həm ailənə hörmətini, həm də öz seçimini qorumaq üçün nə edərdin?" },
  { "id": 30, "title": "Bir gün mən çox qısqanc davranıram və sən bunun səbəbinin səni itirmək qorxusu olduğunu anlayırsan. Məni sakitləşdirməyə çalışardın, yoxsa qısqanclığın müəyyən sərhədi olduğunu göstərərdin?" },
  { "id": 31, "title": "Əgər münasibətimizdə bir mövzuda həmişə sən güzəştə gedirsənsə və mən bunun fərqində deyiləmsə, bir gün partlayana qədər susardın, yoxsa bunu sakit şəkildə mənə izah edərdin?" },
  { "id": 32, "title": "Təsəvvür et ki, mən sənin üçün çox böyük fədakarlıq etmişəm, amma bir gün mübahisə zamanı həmin fədakarlığı sənə xatırladıram. Bu, sənin mənə olan baxışını necə dəyişərdi?" },
  { "id": 33, "title": "Bir gün mən səni incidən bir hərəkəti təkrar edirəm, halbuki əvvəlcədən bunun səni narahat etdiyini demisən. Mən hər dəfə üzr istəsəm, hansı nöqtədə üzr artıq kifayət etməzdi?" },
  { "id": 34, "title": "Təsəvvür et ki, biz bir mübahisədə ikimiz də haqlıyıq, amma hadisəyə tamamilə fərqli baxırıq. Sənin üçün məsələnin həlli nə olardı: kimin haqlı olduğunu tapmaq, yoxsa bir-birimizi anlamaq?" },
  { "id": 35, "title": "Bir gün mən sənə bir mövzuda çox sərt danışmışam və sonra peşman olmuşam. Sən mənimlə dərhal danışıb problemi həll etmək istəyərdin, yoxsa əvvəlcə müəyyən müddət tək qalmaq?" },
  { "id": 36, "title": "Təsəvvür et ki, mən sənin şəxsi gündəliyini təsadüfən görürəm və oxumaq imkanım olur, amma sən bunun tamamilə gizli qalmasını istəyirsən. Mənim yerimdə olsaydın nə edərdin və niyə?" },
  { "id": 37, "title": "Bir gün mən sənə çox şəxsi bir sirrimi danışıram və həmin sirr sənin mənim haqqımda əvvəlki düşüncələrinlə ziddiyyət təşkil edir. Məni keçmişimə görə qiymətləndirərdin, yoxsa indiki davranışlarıma görə?" },
  { "id": 38, "title": "Əgər münasibətimizdə bir müddət mən səndən daha az diqqət göstərsəm, bunun səbəbini öyrənməyə çalışardın, eyni şəkildə davranardın, yoxsa münasibətin gələcəyini düşünməyə başlayardın?" },
  { "id": 39, "title": "Təsəvvür et ki, mənim çox sevdiyim bir insan sənə qarşı hörmətsiz davranır, amma mən həmin anda bunu görmürəm. Məndən necə reaksiya gözləyərdin və hadisəni necə həll edərdin?" },
  { "id": 40, "title": "Bir gün mən sənə sənin üçün çox vacib olan bir şeyi edə bilməyəcəyimi deyirəm. Sevgimizi bu fərqliliyə uyğunlaşdırmağa çalışardın, yoxsa bunun münasibət üçün ciddi uyğunsuzluq olduğunu düşünərdin?" },
  { "id": 41, "title": "Təsəvvür et ki, maddi vəziyyətin birdən-birə çox yaxşılaşır və ətrafındakı insanlar sənə əvvəlkindən daha çox diqqət göstərməyə başlayırlar. Kimin səmimi olduğunu necə müəyyən edərdin?" },
  { "id": 42, "title": "Bir gün sənə çox böyük pul təklif olunur, amma həmin pulu qazanmaq üçün heç kimin bilməyəcəyi kiçik bir haqsızlıq etməlisən. Pul həyatını dəyişəcək qədər çox olsa, qərarın dəyişərdi?" },
  { "id": 43, "title": "Təsəvvür et ki, imtahanda hamı köçürür və yalnız sən dürüst şəkildə cavablandırırsan. Nəticədə digərləri səndən yüksək bal alır. Növbəti imtahanda da eyni prinsiplə davam edərdin?" },
  { "id": 44, "title": "Bir gün işlədiyin yerdə rəhbərin sənin etdiyin böyük bir uğuru öz adına çıxır. Haqqını tələb etsən işini itirmək ehtimalın var. Nə edərdin?" },
  { "id": 45, "title": "Təsəvvür et ki, hamının təriflədiyi bir insanın əslində çox pis xarakterə sahib olduğunu yalnız sən bilirsən. Heç kim sənə inanmayacaqsa, yenə də həqiqəti danışardın?" },
  { "id": 46, "title": "Bir gün çox istədiyin bir şeyi əldə etmək üçün səndən daha çox ehtiyacı olan bir insanla rəqabət aparmalı olursan. Öz məqsədindən imtina edərdin, yoxsa yarışın qaydalarına uyğun mübarizə aparardın?" },
  { "id": 47, "title": "Əgər həyatında hər şey uğursuz gedirsə və insanlar səndən yavaş-yavaş uzaqlaşırsa, ilk olaraq onların sədaqətini, yoxsa öz davranışlarını sorğulayardın?" },
  { "id": 48, "title": "Təsəvvür et ki, sənə çox böyük bir vəzifə verilir və artıq sənə pis davranmış insanlardan birinin gələcəyinə təsir edəcək qərar verməlisən. Keçmiş hisslərinin qərarına qarışmamasını necə təmin edərdin?" },
  { "id": 49, "title": "Bir gün hamının sənə qarşı olduğu bir mübahisədə tamamilə haqlı olduğunu bilirsən, amma bunu sübut etmək üçün illərlə mübarizə aparmalı olacaqsan. Davam edərdin, yoxsa rahatlığını seçərdin?" },
  { "id": 50, "title": "Təsəvvür et ki, həyatda bütün məqsədlərinə çatmısan, amma yaxın münasibətlərinin çoxunu itirmisən. Bu vəziyyətdə özünü uğurlu insan hesab edərdin?" },
  { "id": 51, "title": "Bir gün mən çox böyük bir uğur qazanıram, amma sən həmin dövrdə özünü uğursuz hiss edirsən. Mənə ürəkdən sevinə bilərdin, yoxsa özünü mənimlə müqayisə etdiyini hiss edərdin?" },
  { "id": 52, "title": "Təsəvvür et ki, münasibətimizdə ikimizdən biri digərindən daha çox qazanır. Pulun ailə daxilində qərarvermə gücünə təsir etməsinə necə yanaşardın?" },

    <script>
        class BackgroundParticles {
            constructor() {
                this.canvas = document.getElementById('particle-canvas'); this.ctx = this.canvas.getContext('2d');
                this.particles = []; this.numParticles = window.innerWidth < 768 ? 60 : 150;
                this.resize(); window.addEventListener('resize', () => this.resize());
                this.initParticles(); this.animate();
            }
            resize() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; }
            initParticles() {
                this.particles = [];
                for (let i = 0; i < this.numParticles; i++) {
                    this.particles.push({ x: Math.random() * this.canvas.width, y: Math.random() * this.canvas.height, radius: Math.random() * 1.2 + 0.2, vx: (Math.random() - 0.5) * 0.15, vy: (Math.random() - 0.5) * 0.15, alpha: Math.random() * 0.5 + 0.1, pulseDir: Math.random() > 0.5 ? 1 : -1 });
                }
            }
            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.alpha += 0.005 * p.pulseDir;
                    if (p.alpha > 0.7) { p.alpha = 0.7; p.pulseDir = -1; } if (p.alpha < 0.1) { p.alpha = 0.1; p.pulseDir = 1; }
                    if (p.x < 0) p.x = this.canvas.width; if (p.x > this.canvas.width) p.x = 0;
                    if (p.y < 0) p.y = this.canvas.height; if (p.y > this.canvas.height) p.y = 0;
                    this.ctx.beginPath(); this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); this.ctx.fillStyle = `rgba(216, 180, 254, ${p.alpha})`; this.ctx.fill();
                });
                requestAnimationFrame(() => this.animate());
            }
        }

        class BurstParticles {
            constructor() { this.canvas = document.getElementById('burst-canvas'); this.ctx = this.canvas.getContext('2d'); this.particles = []; this.animating = false; }
            resize(w, h) { this.canvas.width = w; this.canvas.height = h; }
            trigger(x, y) {
                this.particles = [];
                for(let i=0; i<30; i++){
                    const angle = (Math.random() * Math.PI) + Math.PI; const speed = Math.random() * 3 + 1;
                    this.particles.push({ x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, radius: Math.random() * 2 + 1, alpha: 1, life: Math.random() * 0.02 + 0.01 });
                }
                if(!this.animating){ this.animating = true; this.animate(); }
            }
            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height); let alive = false;
                this.particles.forEach(p => {
                    if (p.alpha > 0) {
                        alive = true; p.x += p.vx; p.y += p.vy; p.alpha -= p.life;
                        this.ctx.beginPath(); this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); this.ctx.fillStyle = `rgba(216, 180, 254, ${Math.max(0, p.alpha)})`; this.ctx.fill();
                        this.ctx.shadowBlur = 5; this.ctx.shadowColor = '#d8b4fe';
                    }
                });
                if (alive) { requestAnimationFrame(() => this.animate()); } else { this.animating = false; this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height); }
            }
        }

        const StorageManager = {
            KEY: 'cosmic_wheel_recent',
            get: function() { try { return JSON.parse(localStorage.getItem(this.KEY)) || []; } catch(e) { return []; } },
            add: function(title) { let list = this.get(); if (list[0] !== title) { list.unshift(title); if (list.length > 5) list = list.slice(0, 5); localStorage.setItem(this.KEY, JSON.stringify(list)); } },
            render: function(containerId) {
                const container = document.getElementById(containerId); const list = this.get(); container.innerHTML = '';
                if (list.length === 0) { container.innerHTML = '<span class="text-xs text-purple-500/50">Hələ heç nə seçilməyib</span>'; return; }
                list.slice(0, 3).forEach((title, idx) => {
                    const span = document.createElement('span'); span.className = `history-item text-[11px] px-2 py-1 bg-purple-900/30 border border-purple-500/20 rounded-full text-purple-300`;
                    span.style.animationDelay = `${idx * 0.1}s`; span.textContent = title; container.appendChild(span);
                });
            }
        };

        class TodayChoiceApp {
            constructor() {
                this.items = QUESTIONS; 
                this.numSegments = this.items.length; 
                this.isSpinning = false; this.currentRotation = 0; this.lastSelectedIndex = -1; this.highlightedIndex = -1;
                this.colors = ['#1a0b2e', '#230f3f', '#120524']; 
                this.wheelCanvas = document.getElementById('wheel-canvas'); this.ctx = this.wheelCanvas.getContext('2d', { alpha: true });
                this.spinBtn = document.getElementById('spin-btn');
                this.resultOverlay = document.getElementById('result-overlay'); this.resultCard = document.getElementById('result-card');
                this.resultTitle = document.getElementById('result-title');
                this.btnCloseResult = document.getElementById('btn-close-result'); this.btnSpinAgain = document.getElementById('btn-spin-again');
                this.burstSystem = new BurstParticles();
                this.init();
            }
            init() {
                new BackgroundParticles(); StorageManager.render('history-list');
                this.setupCanvas(); window.addEventListener('resize', () => { this.setupCanvas(); this.drawWheel(); }); this.drawWheel();
                this.bindEvents();
            }
            setupCanvas() {
                const size = 1200; this.wheelCanvas.width = size; this.wheelCanvas.height = size;
                this.centerX = size / 2; this.centerY = size / 2; this.radius = size / 2 - 20;
                const rect = this.wheelCanvas.getBoundingClientRect(); this.burstSystem.resize(rect.width, rect.height);
            }
            drawWheel() {
                const { ctx, centerX, centerY, radius, numSegments, items, colors } = this;
                ctx.clearRect(0, 0, this.wheelCanvas.width, this.wheelCanvas.height); const arc = (Math.PI * 2) / numSegments; ctx.lineWidth = 1;
                for (let i = 0; i < numSegments; i++) {
                    const angle = i * arc - (Math.PI / 2); 
                    ctx.beginPath(); ctx.moveTo(centerX, centerY); ctx.arc(centerX, centerY, radius, angle, angle + arc); ctx.lineTo(centerX, centerY);
                    if (this.highlightedIndex === i) { ctx.fillStyle = '#4c1d95'; ctx.shadowBlur = 20; ctx.shadowColor = '#d8b4fe'; } else { ctx.fillStyle = colors[i % colors.length]; ctx.shadowBlur = 0; }
                    ctx.fill(); ctx.strokeStyle = 'rgba(138, 43, 226, 0.2)'; ctx.stroke(); ctx.shadowBlur = 0; 
                    ctx.save(); ctx.translate(centerX, centerY); ctx.rotate(angle + arc / 2); ctx.textAlign = "right"; ctx.textBaseline = "middle";
                    const text = "SUAL " + items[i].id;
                    ctx.fillStyle = (this.highlightedIndex === i) ? "#ffffff" : "rgba(233, 213, 255, 0.85)"; ctx.font = `600 11px 'Inter', sans-serif`;
                    ctx.fillText(text, radius - 15, 0, radius - 150); 
                    ctx.restore();
                }
            }
            bindEvents() {
                this.spinBtn.addEventListener('click', () => this.spin());
                this.btnSpinAgain.addEventListener('click', () => { this.closeResult(); setTimeout(() => this.spin(), 300); });
                this.btnCloseResult.addEventListener('click', () => this.closeResult());
                this.wheelCanvas.addEventListener('transitionend', () => this.onSpinComplete());
            }
            spin() {
                if (this.isSpinning) return; this.isSpinning = true; this.spinBtn.disabled = true; this.highlightedIndex = -1; this.drawWheel(); 
                
                let historyTitles = StorageManager.get();
                let historyIds = historyTitles.map(t => parseInt(t.replace('Sual #', '')));
                let availableIndices = this.items.map((_, i) => i).filter(i => !historyIds.includes(this.items[i].id));
                
                if (availableIndices.length === 0) availableIndices = this.items.map((_, i) => i).filter(i => i !== this.lastSelectedIndex);
                if (availableIndices.length === 0) availableIndices = [0];
                
                const targetIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)]; 
                this.lastSelectedIndex = targetIndex; this.currentSelectedActivity = this.items[targetIndex];
                const segmentAngle = 360 / this.numSegments; const targetAngleRel = 360 - (targetIndex * segmentAngle);
                const currentMod = this.currentRotation % 360; let rotateBy = targetAngleRel - currentMod;
                const extraSpins = (Math.floor(Math.random() * 4) + 5) * 360; this.currentRotation += (extraSpins + rotateBy);
                const duration = (Math.random() * 3 + 4).toFixed(2);
                this.wheelCanvas.style.transition = `transform ${duration}s cubic-bezier(0.15, 0.95, 0.25, 1)`; this.wheelCanvas.style.transform = `rotate(${this.currentRotation}deg)`;
            }
            onSpinComplete() {
                if (!this.isSpinning) return; this.isSpinning = false; this.highlightedIndex = this.lastSelectedIndex; this.drawWheel();
                const rect = document.getElementById('burst-canvas').getBoundingClientRect(); this.burstSystem.trigger(rect.width / 2, 20);
                StorageManager.add('Sual #' + this.currentSelectedActivity.id); StorageManager.render('history-list');
                setTimeout(() => this.showResult(this.currentSelectedActivity), 600);
            }
            showResult(activity) {
                this.resultTitle.textContent = activity.title;
                this.resultOverlay.classList.remove('hidden'); this.resultOverlay.classList.add('flex');
                this.resultCard.classList.remove('modal-enter'); void this.resultCard.offsetWidth; this.resultCard.classList.add('modal-enter');
            }
            closeResult() { this.resultOverlay.classList.add('hidden'); this.resultOverlay.classList.remove('flex'); this.spinBtn.disabled = false; }
        }
        document.addEventListener('DOMContentLoaded', () => { new TodayChoiceApp(); });
    </script>

    <!-- Kəsilməz Qlobal Musiqi Sistemi -->
    <script>
        window.GlobalAudio = (function() {
            if(window.__globalAudio) return window.__globalAudio;
            const audio = new Audio();
            audio.loop = true;
            const state = JSON.parse(localStorage.getItem('cosmic_audio_state')) || { src: '', time: 0, isPlaying: false };
            if (state.src) {
                audio.src = state.src;
                audio.currentTime = state.time;
                if (state.isPlaying) {
                    audio.play().catch(e => {
                        const resume = () => { audio.play(); document.removeEventListener('click', resume); };
                        document.addEventListener('click', resume, {once: true});
                        document.addEventListener('touchstart', resume, {once: true});
                    });
                }
            }
            setInterval(() => {
                if(!audio.paused && audio.src) {
                    localStorage.setItem('cosmic_audio_state', JSON.stringify({src: audio.src, time: audio.currentTime, isPlaying: true}));
                }
            }, 1000);
            window.addEventListener('beforeunload', () => {
                if(audio.src) localStorage.setItem('cosmic_audio_state', JSON.stringify({src: audio.src, time: audio.currentTime, isPlaying: !audio.paused}));
            });
            window.addEventListener('storage', (e) => {
                if(e.key === 'cosmic_audio_state' && e.newValue) {
                    const newState = JSON.parse(e.newValue);
                    if(!newState.isPlaying && !audio.paused) audio.pause();
                    if(newState.isPlaying && audio.paused && audio.src.endsWith(newState.src)) audio.play().catch(()=>{});
                }
            });
            window.__globalAudio = audio;
            return audio;
        })();
    </script>
